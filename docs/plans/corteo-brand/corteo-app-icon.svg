<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="corteo">
  <title>corteo</title>
  <!-- App icon. Same construction as the 24-grid mark: 320px of mark, 96px of
       clear space on every side, radius 112 (22% of the side). -->
  <rect width="512" height="512" rx="112" fill="#0a0b0d"/>
  <g transform="translate(96 96) scale(13.3333)">
    <polygon fill="#ff4a1f" points="2,2 20,2 2,20"/>
    <polygon fill="#f7f3ea" points="22,22 4,22 22,4"/>
  </g>
</svg>
