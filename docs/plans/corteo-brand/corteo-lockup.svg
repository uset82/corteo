<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 24" width="104" height="24" role="img" aria-label="corteo">
  <title>corteo</title>
  <!-- Lockup spec, not the shipped asset: in the app the wordmark is real text
       (CorteoWordmark, DINish Condensed Black 900, lowercase, 0.02em) so a screen
       reader reads a word. Here the text needs the font installed.
       Mark 20px, gap 9px (0.45 x mark), wordmark 15px, baseline 17.5. -->
  <g transform="translate(0 2) scale(0.8333)">
    <polygon fill="#ff4a1f" points="2,2 20,2 2,20"/>
    <polygon fill="#f7f3ea" points="22,22 4,22 22,4"/>
  </g>
  <text x="29" y="17.5" fill="#f7f3ea"
        font-family="DINish Condensed, 'Arial Narrow', Arial, sans-serif"
        font-weight="900" font-size="15" letter-spacing="0.3">corteo</text>
</svg>
