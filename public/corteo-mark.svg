<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="corteo">
  <title>corteo</title>
  <!-- Favicon: the mark on the editor's void, 4px of clear space on every side. -->
  <rect width="32" height="32" rx="7" fill="#0a0b0d"/>
  <g transform="translate(4 4)">
    <polygon fill="#ff4a1f" points="2,2 20,2 2,20"/>
    <polygon fill="#f7f3ea" points="22,22 4,22 22,4"/>
  </g>
</svg>
