  <style type="text/css" data-vite-dev-id="/workspace/src/index.css">/* Self-hosted UI typefaces (both OFL-1.1):
 * - 'Geist' — the UI brand sans (OFL-1.1, Vercel).
 * - 'Geist Mono' — the monospace slot; the family NAME stays 'Geist Mono'
 *   (so the many `font-family:'Geist Mono, …'` references and trailing
 *   ui-monospace/SFMono/Menlo/monospace fallback stack work unchanged), but
 *   its glyphs are now provided by IoskeleyMono (OFL-1.1, a Berkeley Mono
 *   look-alike built by configuring Iosevka — https://github.com/ahatem/IoskeleyMono).
 * Chinese glyphs are not covered and fall back to the system UI stack
 * (PingFang / Microsoft YaHei) via the trailing system-ui entries. */
@font-face {
  font-family: 'Geist';
  src: url('/fonts/Geist-Regular.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Geist';
  src: url('/fonts/Geist-Medium.woff2') format('woff2');
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Geist';
  src: url('/fonts/Geist-SemiBold.woff2') format('woff2');
  font-weight: 600;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Geist';
  src: url('/fonts/Geist-Bold.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Geist Mono';
  src: url('/fonts/IoskeleyMono-Regular.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Geist Mono';
  src: url('/fonts/IoskeleyMono-Medium.woff2') format('woff2');
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Geist Mono';
  src: url('/fonts/IoskeleyMono-SemiBold.woff2') format('woff2');
  font-weight: 600;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Geist Mono';
  src: url('/fonts/IoskeleyMono-Bold.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
:root { color-scheme: dark; }   /* tell the browser we're already dark → skip force-dark-mode */
* { box-sizing: border-box; }
html, body, #root { margin: 0; height: 100%; }
html, body { overflow: hidden; }
#root { overflow: hidden; }

/*
 * Global keyboard focus ring (impeccable polish · product register):
 * Previously, there were only 5 scattered focus styles, and the rest of the controls were streaking/the browser's default blue box was inconsistent with the brand.
 * :focus-visible only exits the loop for keyboard navigation, mouse clicks are not affected; use theme.accent for color.
 */
:focus-visible {
  outline: 2px solid var(--cc-accent);
  outline-offset: 1px;
}

/* Motion effect degradation (a11y hard requirement): UI transition/animation is approximately instantaneous; Remotion synthesis and JS frame driver are not affected */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/*
 * Hairline scrollbars.
 * Important: do NOT set `scrollbar-width: thin` globally on Chromium —
 * modern Chrome honors that (~8px) and ignores ::-webkit-scrollbar width.
 * Use webkit pseudos for Blink/WebKit; Firefox-only for scrollbar-width.
 */
*::-webkit-scrollbar { width: 2px; height: 2px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: rgba(var(--cc-ink-rgb), 0.14);
  border-radius: 999px;
  border: none;
  min-height: 20px;
}
*::-webkit-scrollbar-thumb:hover { background: rgba(var(--cc-ink-rgb), 0.32); }
*::-webkit-scrollbar-corner { background: transparent; }
/* Firefox: thinnest visible option (no sub-thin width) */
@supports not selector(::-webkit-scrollbar) {
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(var(--cc-ink-rgb), 0.18) transparent;
  }
}

/* recording indicator pulse (timeline mic button) */
@keyframes cc-rec-pulse {
  0%   { box-shadow: 0 0 0 0 rgba(var(--cc-accent-rgb), 0.55); opacity: 1; }
  70%  { box-shadow: 0 0 0 6px rgba(var(--cc-accent-rgb), 0); opacity: 0.7; }
  100% { box-shadow: 0 0 0 0 rgba(var(--cc-accent-rgb), 0); opacity: 1; }
}

button, input, select { font: inherit; }

.cc-timeline-hover-guide {
  position:absolute; top:0; width:1px; z-index:12; pointer-events:none;
  background:rgba(var(--cc-accent-rgb),0.5);
}
.cc-preview-hover-frame {
  position:absolute; right:10px; bottom:10px; z-index:10; pointer-events:none;
  width:clamp(72px,22%,132px); overflow:hidden; border-radius:5px;
  border:1px solid var(--cc-accent); background:var(--cc-panel);
  box-shadow:0 4px 14px rgba(var(--cc-shadow-rgb),0.24);
}
.cc-timeline-clip.is-audio-muted::after {
  content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
  background:color-mix(in srgb,var(--cc-bg) 56%,transparent);
}
.cc-timeline-clip.is-audio-muted .cc-clip-wave,
.cc-timeline-clip.is-audio-muted .cc-audio-waveform { opacity:.28; filter:saturate(.25); }
.cc-timeline-clip.is-audio-muted .cc-clip-label { opacity:.58; }
.cc-clip-muted-indicator {
  position:absolute; top:4px; left:5px; z-index:4; width:18px; height:18px;
  display:grid; place-items:center; border:0.5px solid color-mix(in srgb,var(--cc-text-strong) 38%,transparent);
  border-radius:4px; background:color-mix(in srgb,var(--cc-bg) 78%,transparent);
  color:var(--cc-text-strong); pointer-events:none;
}

/* Shared editor surface typography: dialogs, popovers, and inspector use one baseline. */
:where(.cc-semantic-panel, .cc-export-panel, .cc-inspector) {
  font-family:Geist, system-ui, -apple-system, sans-serif;
  font-size:11.5px;
  line-height:1.35;
}

/* header icon button (settings) — dim at rest, brighten on hover */
.cc-header-btn { transition: color 0.12s, background 0.12s; }
.cc-header-btn:hover { color: var(--cc-text) !important; background: rgba(var(--cc-ink-rgb), 0.06); }

/* macOS custom titlebar: retain native placement and behavior at renderer scale. */
.cc-window-titlebar--mac {
  padding-left:84px !important;
  position:relative;
  app-region:drag;
  user-select:none;
}
.cc-window-controls {
  position:absolute; left:12px; top:50%; z-index:2;
  display:flex; align-items:center; gap:8px; height:12px;
  transform:translateY(-50%);
  app-region:no-drag;
}
.cc-window-control {
  appearance:none; position:relative; width:12px; height:12px; min-width:12px; padding:0;
  box-sizing:border-box; flex:0 0 12px; align-self:center; margin:0;
  border:0.5px solid rgba(var(--cc-shadow-rgb),0.18); border-radius:50%; cursor:pointer;
  box-shadow:inset 0 0 0 0.25px rgba(var(--cc-shadow-rgb),0.2);
}
.cc-window-control--close { background:var(--cc-danger); }
.cc-window-control--minimize { background:var(--cc-gold); }
.cc-window-control--maximize { background:var(--cc-success); }
.cc-window-control-glyph {
  position:absolute; left:50%; top:50%; width:6px; height:6px;
  transform:translate(-50%, -50%); color:rgba(var(--cc-shadow-rgb),0.72); font-size:0;
  opacity:0; pointer-events:none; transition:opacity 100ms ease;
}
.cc-window-control-glyph::before,
.cc-window-control-glyph::after {
  content:""; position:absolute; left:50%; top:50%; width:6px; height:1px;
  border-radius:1px; background:currentColor; transform:translate(-50%, -50%);
}
.cc-window-control--close .cc-window-control-glyph::before { transform:translate(-50%, -50%) rotate(45deg); }
.cc-window-control--close .cc-window-control-glyph::after { transform:translate(-50%, -50%) rotate(-45deg); }
.cc-window-control--minimize .cc-window-control-glyph::after { display:none; }
.cc-window-control--maximize .cc-window-control-glyph::after { transform:translate(-50%, -50%) rotate(90deg); }
.cc-window-controls:hover .cc-window-control-glyph { opacity:1; }
.cc-window-control:focus-visible { outline:1.5px solid var(--cc-text); outline-offset:2px; }
.cc-window-titlebar--mac button,
.cc-window-titlebar--mac input,
.cc-window-titlebar--mac select,
.cc-window-titlebar--mac [data-cc-titlebar-control="true"] {
  app-region:no-drag;
}

/* Editor chrome keeps its actions reachable while the centered project title yields first. */
.cc-topbar { min-width:0; }
.cc-topbar-title { max-width:40vw; min-width:0; }
.cc-topbar-title > span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cc-topbar-title input { width:100%; min-width:0 !important; }
.cc-topbar-actions { min-width:0; margin-left:auto; display:flex; align-items:center; gap:4px; }
.cc-topbar-actions > * { flex-shrink:0; }
@media (max-width:1100px) {
  .cc-topbar-title { max-width:18vw; }
}
@media (max-width:800px) {
  .cc-topbar-title { display:none !important; }
}

/* Vendor marks have mixed source viewBoxes; normalize both the host and its inline SVG. */
.cc-vendor-icon { display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; line-height:0; overflow:hidden; }
.cc-vendor-icon svg { display:block; width:100%; height:100%; fill:currentColor; }

.cc-chat-panel { container:chat-panel / inline-size; }
.cc-chat-messages-shell { position:relative; flex:1; min-height:0; }
.cc-chat-messages { height:100%; min-height:0; overflow-y:auto; padding:4px 14px; color:var(--cc-text); font-size:13.5px; }
.cc-chat-scroll-navigation {
  position:absolute; left:50%; z-index:4; display:flex; align-items:center; padding:2px;
  border:0.5px solid var(--cc-border-light); border-radius:4px; background:var(--cc-panel-alt);
  box-shadow:0 3px 10px rgba(var(--cc-shadow-rgb),.22); transform:translateX(-50%);
}
.cc-chat-scroll-navigation--top { top:10px; }
.cc-chat-scroll-navigation--bottom { bottom:10px; }
.cc-chat-scroll-navigation-button {
  width:28px; height:26px; display:grid; place-items:center; padding:0;
  border:0; border-radius:4px; background:transparent; color:var(--cc-text-muted); cursor:pointer;
}
.cc-chat-scroll-navigation-button:hover { background:var(--cc-hover); color:var(--cc-text); }
.cc-chat-scroll-navigation-button:focus-visible { outline:1px solid var(--cc-accent); outline-offset:1px; }
.cc-chat-scroll-navigation-button--bottom svg { transform:rotate(180deg); }
@supports not selector(::-webkit-scrollbar) {
  .cc-agent-change-log-list {
    scrollbar-width:thin;
    scrollbar-color:rgba(var(--cc-ink-rgb),0.22) transparent;
  }
}
.cc-agent-change-log-list::-webkit-scrollbar { width:6px; }
.cc-agent-change-log-list::-webkit-scrollbar-track { background:transparent; }
.cc-agent-change-log-list::-webkit-scrollbar-thumb {
  background:rgba(var(--cc-ink-rgb),0.22);
  border-radius:999px;
}
.cc-agent-change-log-list::-webkit-scrollbar-thumb:hover { background:rgba(var(--cc-ink-rgb),0.38); }
/* chat composer: top-edge drag handle to grow/shrink input area */
.cc-chat-composer { container-type:inline-size; container-name:composer; }
.cc-chat-composer-resize {
  position:absolute; top:0; left:0; right:0; height:10px; z-index:2;
  display:flex; align-items:center; justify-content:center;
  cursor:ns-resize; touch-action:none; user-select:none;
}
.cc-chat-composer-resize-grip {
  width:28px; height:3px; border-radius:2px; background:var(--cc-border-light);
  opacity:0.55; transition:opacity .12s ease, background .12s ease;
}
.cc-chat-composer-resize:hover .cc-chat-composer-resize-grip,
.cc-chat-composer-resize:active .cc-chat-composer-resize-grip {
  opacity:1; background:var(--cc-text-muted);
}
/* toolbar: send pinned right; tools compact; menus are position:fixed so no clip */
.cc-chat-composer-bar {
  display:flex; align-items:center; gap:4px; margin-top:2px; flex-shrink:0;
  width:100%; min-width:0; box-sizing:border-box;
}
.cc-chat-composer-bar-tools {
  display:flex; align-items:center; gap:0; flex:1 1 auto; min-width:0;
}
.cc-composer-secondary { display:contents; }
.cc-composer-more-btn { display:none !important; }
.cc-composer-more-menu { display:flex; flex-direction:column; gap:1px; }
.cc-composer-more-item {
  width:100%; min-height:32px; display:grid; grid-template-columns:20px minmax(0,1fr) 14px;
  align-items:center; gap:7px; padding:0 8px; border:0; border-radius:3px;
  background:transparent; color:var(--cc-text-muted); cursor:pointer; text-align:left; font-size:12px;
}
.cc-composer-more-item:hover:not(:disabled) { background:var(--cc-hover); color:var(--cc-text); }
.cc-composer-more-item:disabled { opacity:.4; cursor:default; }
.cc-composer-more-item > span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
@container composer (max-width:390px) {
  .cc-chat-composer-bar-tools { gap:2px; }
  .cc-chat-model-btn { flex:1 1 auto !important; max-width:none !important; }
  .cc-composer-secondary { display:none; }
  .cc-composer-more-btn { display:flex !important; }
}
.cc-chat-send-btn { flex:0 0 28px; }
.cc-chat-messages.empty { display:flex; align-items:center; justify-content:center; overflow:hidden; }
.cc-chat-header { min-height:48px; display:flex; align-items:center; gap:8px; padding:6px 12px; box-sizing:border-box; border-bottom:0.5px solid var(--cc-border); }
.cc-chat-capability-banner { display:flex; align-items:center; gap:6px; padding:6px 12px; background:color-mix(in srgb, var(--cc-accent) 8%, var(--cc-panel)); border-bottom:0.5px solid var(--cc-border); font-size:11px; color:var(--cc-text-dim); line-height:1.45; }
.cc-chat-capability-banner span { flex:1; min-width:0; }
.cc-chat-capability-banner > button:not(.cc-chat-capability-banner-close) { flex:0 0 auto; border:0.5px solid var(--cc-border); background:var(--cc-panel-alt); color:var(--cc-text); border-radius:4px; padding:2px 8px; font-size:11px; cursor:pointer; }
.cc-chat-capability-banner-close { flex:0 0 auto; border:none; background:transparent; color:var(--cc-text-dim); padding:2px 4px; font-size:13px; cursor:pointer; line-height:1; }
.cc-chat-brand { min-width:0; flex:1; display:flex; align-items:center; gap:8px; }
.cc-chat-brand-copy { min-width:0; display:flex; flex-direction:column; color:var(--cc-text); line-height:1.15; }
.cc-chat-brand-copy small { margin-top:2px; color:var(--cc-text-dim); font-size:9.5px; }
.cc-chat-collapsed-brand { writing-mode:vertical-rl; color:var(--cc-text-dim); font-size:10px; letter-spacing:1.5px; }
@container chat-panel (max-width:220px) {
  .cc-chat-header { gap:4px; padding-inline:8px; }
  .cc-chat-brand { gap:4px; }
  .cc-chat-brand-copy svg { width:86px; height:auto; }
  .cc-chat-brand-copy small { display:none; }
  .cc-chat-messages { padding-inline:8px; }
  .cc-chat-onboarding h2 { font-size:16px; line-height:21px; }
}
.cc-chat-onboarding { width:100%; max-width:348px; transform:translateY(-4px); }
.cc-chat-onboarding-kicker { margin-bottom:7px; color:var(--cc-accent); font-size:10.5px; font-weight:650; letter-spacing:0.3px; }
.cc-chat-onboarding h2 { margin:0; color:var(--cc-text); font-size:18px; font-weight:650; letter-spacing:-0.25px; line-height:24px; }
.cc-chat-onboarding > p { margin:5px 0 17px; color:var(--cc-text-dim); font-size:11.5px; line-height:18px; }
.cc-chat-starter-list { display:flex; flex-direction:column; border-top:0.5px solid var(--cc-border); }
.cc-chat-starter-list button { min-width:0; min-height:52px; display:flex; align-items:center; gap:10px; padding:7px 4px; overflow:hidden; border:0; border-bottom:0.5px solid var(--cc-border); border-radius:0; background:transparent; color:var(--cc-text); cursor:pointer; text-align:left; }
.cc-chat-starter-list button:hover { background:rgba(var(--cc-ink-rgb),0.035); }
.cc-chat-starter-list button:focus-visible { outline:1px solid var(--cc-accent); outline-offset:-1px; }
.cc-chat-starter-icon { width:30px; height:30px; flex:0 0 30px; display:grid; place-items:center; border-radius:4px; background:var(--cc-panel-alt); color:var(--cc-text-muted); transition:background-color 160ms ease-out,color 160ms ease-out; }
.cc-chat-starter-list button:hover .cc-chat-starter-icon { background:rgba(var(--cc-accent-rgb),0.14); color:var(--cc-accent); }
.cc-chat-starter-copy { min-width:0; flex:1; display:flex; flex-direction:column; gap:3px; }
.cc-chat-starter-copy strong { overflow:hidden; font-size:12.5px; font-weight:600; line-height:16px; text-overflow:ellipsis; white-space:nowrap; }
.cc-chat-starter-copy small { overflow:hidden; color:var(--cc-text-dim); font-size:10.5px; line-height:14px; text-overflow:ellipsis; white-space:nowrap; }
.cc-chat-starter-arrow { color:var(--cc-text-dim); font-size:14px; transform:translateX(-3px); opacity:0; transition:opacity 160ms ease-out,transform 160ms ease-out; }
.cc-chat-starter-list button:hover .cc-chat-starter-arrow { transform:translateX(0); opacity:1; }
.cc-creative-picker-head { display:flex; align-items:center; gap:9px; padding:6px 7px 10px; }
.cc-creative-picker-head > span { width:30px; height:30px; flex:0 0 30px; display:grid; place-items:center; border-radius:4px; background:rgba(var(--cc-accent-rgb),0.15); color:var(--cc-accent); }
.cc-creative-picker-head > div { min-width:0; display:flex; flex-direction:column; gap:2px; }
.cc-creative-picker-head strong { color:var(--cc-text); font-size:12.5px; font-weight:650; line-height:16px; }
.cc-creative-picker-head small { color:var(--cc-text-dim); font-size:10.5px; line-height:14px; }
.cc-creative-picker-section { margin:4px 2px 2px; padding:8px 6px 4px; border-top:0.5px solid var(--cc-border); color:var(--cc-text-dim); font-size:10.5px; }
.cc-creative-mode-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; padding-bottom:2px; }
.cc-creative-mode-row { width:100%; min-width:0; display:grid; grid-template-columns:30px minmax(0,1fr) 16px; align-items:center; gap:9px; padding:7px 6px; border:0; border-radius:3px; background:transparent; color:var(--cc-text); cursor:pointer; text-align:left; }
.cc-creative-mode-row:hover { background:rgba(var(--cc-ink-rgb),0.05); }

.cc-creative-mode-icon { width:30px; height:30px; display:grid; place-items:center; border-radius:4px; background:var(--cc-panel); color:var(--cc-text-muted); }
.cc-creative-mode-row[data-active="true"] .cc-creative-mode-icon { background:rgba(var(--cc-accent-rgb),0.16); color:var(--cc-accent); }
.cc-creative-mode-copy { min-width:0; display:flex; flex-direction:column; gap:2px; }
.cc-creative-mode-title { min-width:0; display:flex; align-items:center; gap:5px; }
.cc-creative-mode-copy strong { overflow:hidden; font-size:12.5px; font-weight:600; line-height:16px; text-overflow:ellipsis; white-space:nowrap; }
.cc-creative-mode-copy small { overflow:hidden; color:var(--cc-text-dim); font-size:10.5px; line-height:14px; text-overflow:ellipsis; white-space:nowrap; }
.cc-creative-mode-title em { flex-shrink:0; padding:0 4px; border:0.5px solid var(--cc-border-light); border-radius:4px; color:var(--cc-text-dim); font-size:9px; font-style:normal; line-height:14px; }
.cc-creative-mode-check { display:grid; place-items:center; color:var(--cc-accent); }
.cc-creative-mode-card { min-height:76px; align-items:start; gap:6px; padding:8px 7px; border:0.5px solid var(--cc-border); border-radius:6px; }
.cc-creative-mode-card:hover { border-color:var(--cc-border-light); }
.cc-creative-mode-card[data-active="true"] { border-color:rgba(var(--cc-accent-rgb),0.55); }
.cc-creative-mode-card .cc-creative-mode-copy strong { font-size:11.5px; }
.cc-creative-mode-card .cc-creative-mode-copy small { display:-webkit-box; overflow:hidden; -webkit-box-orient:vertical; -webkit-line-clamp:3; text-overflow:ellipsis; white-space:normal; }

/* Compact skill-library cards (Skills tab) + per-card edit/delete actions. */
.cc-skill-card-wrap { position:relative; min-width:0; }
.cc-skill-card-wrap .cc-creative-mode-card { min-height:50px; padding:5px 7px; gap:5px; }
.cc-skill-card-wrap .cc-creative-mode-icon { width:24px; height:24px; }
.cc-skill-card-wrap .cc-creative-mode-icon svg { width:13px; height:13px; }
.cc-skill-card-wrap .cc-creative-mode-copy small { -webkit-line-clamp:2; }
.cc-skill-actions { position:absolute; top:4px; right:5px; display:flex; gap:2px; opacity:0; transition:opacity 0.12s ease; }
.cc-skill-card-wrap:hover .cc-skill-actions { opacity:1; }
.cc-skill-actions button { padding:0 5px; height:18px; border:0.5px solid var(--cc-border-light); border-radius:4px; background:var(--cc-panel); color:var(--cc-text-dim); font-size:10.5px; line-height:16px; cursor:pointer; }
.cc-skill-actions button:hover { color:var(--cc-text); border-color:var(--cc-border); }
.cc-skill-actions .cc-skill-delete-confirm { border-color:var(--cc-danger); background:var(--cc-danger); color:var(--cc-on-accent); }
.cc-chat-popover-backdrop { position:fixed; inset:0; z-index:80; }

@media (prefers-reduced-motion: reduce) {

}

/* Editor asset panel. */
.cc-library-panel { display:flex; flex-direction:column; height:100%; min-height:0; overflow:hidden; background:var(--cc-panel); border-right:0.5px solid var(--cc-border); container:library-panel / inline-size; font-family:Geist, system-ui,-apple-system,sans-serif; }
.cc-main-tabs { display:flex; align-items:center; gap:12px; min-height:30px; padding:0 12px; overflow-x:auto; flex-shrink:0; scrollbar-width:none; }
.cc-main-tab { height:30px; padding:0; border:0; border-bottom:1px solid transparent; background:transparent; color:var(--cc-text-dim); cursor:pointer; font-size:12px; font-weight:500; line-height:29px; white-space:nowrap; transition:border-color 120ms ease-out,color 120ms ease-out; }
.cc-main-tab:hover,.cc-main-tab:focus-visible { color:var(--cc-text); }
.cc-main-tab.selected { border-bottom-color:var(--cc-accent); color:var(--cc-text); }

.cc-sequence-panel { flex:1; min-height:0; overflow-y:auto; padding:8px 10px 12px; border-top:0.5px solid var(--cc-border); }
.cc-sequence-hint { margin:0 2px 8px; color:var(--cc-text-dim); font-size:11px; line-height:16px; }
.cc-sequence-list { display:flex; flex-direction:column; }
.cc-sequence-row { width:100%; min-width:0; min-height:36px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 4px; border:0; border-bottom:0.5px solid var(--cc-border); border-radius:0; background:transparent; color:var(--cc-text); cursor:pointer; text-align:left; transition:background-color 120ms ease-out,color 120ms ease-out; }
.cc-sequence-row:hover:not(:disabled) { background:rgba(var(--cc-ink-rgb),0.04); }
.cc-sequence-row:disabled { color:var(--cc-text-dim); cursor:not-allowed; opacity:0.55; }
.cc-sequence-name { min-width:0; flex:1; overflow:hidden; color:inherit; font-size:12px; font-weight:500; line-height:16px; text-overflow:ellipsis; white-space:nowrap; }
.cc-sequence-duration { flex:0 0 auto; color:var(--cc-text-dim); font-family:Geist Mono, ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; font-variant-numeric:tabular-nums; line-height:14px; white-space:nowrap; }

/* Resource library transition card grid. */
.cc-transition-browser { display:flex; flex-direction:column; gap:10px; min-height:0; }
.cc-transition-subtabs { display:flex; gap:6px; flex-wrap:wrap; }
.cc-transition-subtab {
  flex-shrink:0; cursor:pointer; font-size:12px; padding:4px 12px; border-radius:999px;
  border:0.5px solid var(--cc-border); background:transparent; color:var(--cc-text-muted); white-space:nowrap;
}
.cc-transition-subtab:hover { border-color:var(--cc-border-light); color:var(--cc-text-muted); }
.cc-transition-subtab.selected { border-color:var(--cc-text); background:var(--cc-text); color:var(--cc-panel); font-weight:600; }

.cc-template-card {
  position:relative; width:100%; max-width:120px; height:97px; min-width:0; overflow:hidden;
  border:0.5px solid var(--cc-border); border-radius:4px; background:var(--cc-panel-alt);
  color:var(--cc-text); cursor:grab;
  transition:border-color 140ms ease, box-shadow 140ms ease;
}
.cc-template-card:hover,.cc-template-card:focus-within {
  border-color:var(--cc-border-light); box-shadow:0 8px 24px rgba(var(--cc-shadow-rgb),.35);
}
.cc-template-add { width:100%; display:block; padding:0; border:0; background:none; color:inherit; cursor:inherit; text-align:left; }
.cc-template-thumb { position:relative; width:100%; height:67.5px; overflow:hidden; background:var(--cc-bg); }
.cc-template-thumb img { position:absolute; inset:0; width:100%; height:100%; display:block; }
.cc-template-thumb-backdrop { object-fit:cover; filter:blur(16px) brightness(.5); transform:scale(1.25); }
.cc-template-thumb-image { object-fit:cover; transition:transform 180ms ease; }
.cc-template-thumb-image.portrait { object-fit:contain; }
.cc-template-card:hover .cc-template-thumb-image,.cc-template-card:focus-within .cc-template-thumb-image { transform:scale(1.035); }
.cc-template-thumb-missing { position:absolute; inset:0; display:grid; place-items:center; color:var(--cc-text-dim); font-size:20px; }
.cc-template-meta { min-width:0; display:flex; align-items:center; gap:6px; box-sizing:border-box; padding:6px 8px 7px; }
.cc-template-name { min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:10.5px; line-height:1.3; }
.cc-template-ratio { flex-shrink:0; padding:.5px 4px; border:.5px solid var(--cc-border); border-radius:4px; color:var(--cc-text-dim); font-size:8.5px; line-height:1.4; }
.cc-template-favorite,.cc-template-more {
  position:absolute; top:5px; width:22px; height:22px; display:grid; place-items:center;
  padding:0; border:0; border-radius:50%; background:rgba(var(--cc-shadow-rgb),.67); color:var(--cc-text-strong);
  opacity:0; cursor:pointer; transition:opacity 100ms ease;
}
.cc-template-favorite { left:5px; }
.cc-template-more { right:5px; font-size:13px; line-height:1; }
.cc-template-card:hover .cc-template-favorite,.cc-template-card:hover .cc-template-more,
.cc-template-card:focus-within .cc-template-favorite,.cc-template-card:focus-within .cc-template-more,
.cc-template-card.favorite .cc-template-favorite,.cc-template-card.menu-open .cc-template-more { opacity:1; }
.cc-template-card.favorite .cc-template-favorite { color:var(--cc-gold); }

.cc-resource-browser { display:flex; flex-direction:column; gap:6px; min-height:0; }
.cc-resource-tertiary-tabs,.cc-sound-chips { position:sticky; top:-10px; z-index:3; background:var(--cc-panel); }
.cc-template-category-tabs { margin-top:-10px; padding-top:10px; }
.cc-resource-hint { font-size:10.5px; line-height:1.35; margin-bottom:2px; }
/* Compact 3-col grid — thumbs smaller than earlier 16/10 full-bleed cards */
.cc-resource-grid { position:relative; width:100%; min-height:0; }
.cc-resource-virtual-row {
  position:absolute; left:0; width:100%; display:grid; column-gap:8px; justify-content:space-evenly;
}
.cc-resource-list-item:hover { border-color:var(--cc-accent) !important; }
.cc-resource-card {
  min-width:0; padding:0; border:0; background:transparent; color:var(--cc-text-muted);
  cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:4px;
}
/* dim when not applicable, but keep pointer-events for hover preview */
.cc-resource-card.disabled { cursor:pointer; opacity:0.72; }
.cc-resource-thumb {
  /* Compact card proportions. */
  width:100%; max-width:118px; aspect-ratio:16 / 11; border-radius:5px; overflow:hidden;
  background:var(--cc-panel-alt); border:0.5px solid var(--cc-hover); position:relative;
  margin:0 auto; /* center in grid cell when max-width caps size */
}
.cc-resource-card.hovered .cc-resource-thumb,
.cc-resource-card:hover .cc-resource-thumb { border-color:var(--cc-border-light); box-shadow:0 0 0 0.5px rgba(var(--cc-ink-rgb), 0.08); }
.cc-resource-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.cc-resource-thumb-placeholder { display:block; width:100%; height:100%; background:linear-gradient(135deg,var(--cc-panel-alt),var(--cc-border)); }
.cc-resource-name {
  font-size:10px; line-height:1.25; color:var(--cc-text-muted); text-align:center;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 1px;
  max-width:118px; margin:0 auto; width:100%;
}
.cc-resource-card.hovered .cc-resource-name,
.cc-resource-card:hover .cc-resource-name { color:var(--cc-text); }
.cc-resource-empty { min-height:80px; }

/* ── Sound effects browser ── */
.cc-sound-browser { display:flex; flex-direction:column; gap:8px; min-height:0; }
.cc-sound-search {
  display:flex; align-items:center; gap:6px; height:28px; padding:0 8px;
  border:0.5px solid var(--cc-border); border-radius:6px; background:var(--cc-inset); color:var(--cc-text-dim);
}
.cc-sound-search:focus-within { border-color:var(--cc-border-light); color:var(--cc-text-muted); }
.cc-sound-search input {
  flex:1; min-width:0; height:26px; border:0; outline:0; background:transparent;
  color:var(--cc-text); font-size:12px; line-height:12px;
}
.cc-sound-search input::placeholder { color:var(--cc-text-dim); }
.cc-sound-search-clear {
  display:grid; place-items:center; width:18px; height:18px; padding:0;
  border:0; border-radius:4px; background:transparent; color:var(--cc-text-dim); cursor:pointer;
}
.cc-sound-search-clear:hover { background:var(--cc-hover); color:var(--cc-text); }
.cc-sound-chips {
  display:flex; gap:6px; overflow-x:auto; margin-top:-10px; padding-top:10px; padding-bottom:2px;
}
.cc-sound-chip {
  flex-shrink:0; cursor:pointer; font-size:11.5px; padding:4px 11px; border-radius:999px;
  border:0.5px solid var(--cc-border); background:transparent; color:var(--cc-text-muted); white-space:nowrap;
}
.cc-sound-chip:hover { border-color:var(--cc-border-light); color:var(--cc-text-muted); }
.cc-sound-chip.selected { border-color:var(--cc-text); background:var(--cc-text); color:var(--cc-panel); font-weight:600; }
.cc-sound-list { position:relative; width:100%; min-height:0; }
.cc-sound-row {
  display:grid;
  grid-template-columns:26px minmax(72px,0.9fr) minmax(72px,1.2fr) 34px 28px;
  align-items:center; gap:8px; min-height:40px; min-width:0;
  padding:4px 6px; border-radius:5px; background:var(--cc-panel-alt); cursor:pointer;
  box-shadow:inset 0 0 0 0.5px transparent;
  transition: box-shadow 80ms ease, background 80ms ease;
}
.cc-sound-row:hover { box-shadow:inset 0 0 0 0.5px rgba(var(--cc-ink-rgb), 0.25); }
.cc-sound-row.active { background:var(--cc-hover); box-shadow:inset 0 0 0 0.5px rgba(var(--cc-ink-rgb), 0.19); }
.cc-sound-glyph {
  width:26px; height:26px; border:0; border-radius:5px; padding:0;
  display:grid; place-items:center; cursor:pointer; flex-shrink:0;
}
.cc-sound-meta { min-width:0; }
.cc-sound-name {
  font-size:11.5px; line-height:16px; font-weight:500; color:var(--cc-text-muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.cc-sound-row:hover .cc-sound-name,
.cc-sound-row.active .cc-sound-name { color:var(--cc-text); }
.cc-sound-wave { min-width:0; height:22px; }
.cc-sound-wave svg { display:block; width:100%; height:100%; }
.cc-sound-wave-base { fill:rgba(var(--cc-ink-rgb), 0.22); }
.cc-sound-wave-prog { fill:color-mix(in srgb, var(--cc-select) 65%, var(--cc-text-strong)); }
.cc-sound-dur {
  font-size:10.5px; color:var(--cc-text-dim); font-variant-numeric:tabular-nums; text-align:right;
  justify-self:end;
}
.cc-sound-add {
  width:28px; height:28px; border:0; border-radius:5px; padding:0;
  display:grid; place-items:center; background:transparent; color:var(--cc-text-dim); cursor:pointer;
}
.cc-sound-add:hover { background:var(--cc-hover); color:var(--cc-text); }
.cc-sound-empty {
  color:var(--cc-text-dim); font-size:12px; text-align:center; padding:28px 10px; line-height:1.45;
}
.cc-sound-hint { font-size:10.5px; color:var(--cc-text-dim); line-height:1.35; margin-top:2px; }

/* ── Audio FX browser (not BGM) ── */
.cc-audiofx-browser { display:flex; flex-direction:column; gap:10px; min-height:0; }
.cc-audiofx-hint { font-size:11px; color:var(--cc-text-dim); line-height:1.4; }
.cc-audiofx-list { display:flex; flex-direction:column; gap:8px; }
.cc-audiofx-card {
  display:flex; align-items:flex-start; gap:12px; text-align:left;
  padding:12px; border:0.5px solid var(--cc-border); border-radius:4px; background:var(--cc-panel-alt);
  color:var(--cc-text); cursor:pointer;
}
.cc-audiofx-card:hover:not(:disabled) { border-color:var(--cc-border-light); background:var(--cc-panel-alt); }
.cc-audiofx-card.pending,
.cc-audiofx-card:disabled { opacity:0.72; cursor:default; }
.cc-audiofx-thumb {
  width:48px; height:48px; border-radius:4px; flex-shrink:0;
  display:grid; place-items:center;
  background:linear-gradient(145deg, var(--cc-panel-alt), var(--cc-inset));
  color:var(--cc-text-muted); border:0.5px solid var(--cc-border);
}
.cc-audiofx-body { min-width:0; flex:1; }
.cc-audiofx-name {
  font-size:13px; font-weight:600; color:var(--cc-text); display:flex; align-items:center; gap:8px;
}
.cc-audiofx-badge {
  font-size:9.5px; font-weight:500; color:var(--cc-text); border:0.5px solid color-mix(in srgb, var(--cc-gold) 42%, var(--cc-panel));
  border-radius:4px; padding:1px 5px; background:color-mix(in srgb, var(--cc-gold) 10%, var(--cc-panel));
}
.cc-audiofx-desc { font-size:11px; color:var(--cc-text-dim); line-height:1.4; margin-top:4px; }
.cc-audiofx-note {
  font-size:10.5px; color:var(--cc-text-dim); line-height:1.45; padding:2px 2px 0;
}
.cc-audiofx-note code {
  font-size:10px; color:var(--cc-text-muted); background:var(--cc-panel-alt); padding:1px 4px; border-radius:3px;
}

/* Shared live thumb (transition / special effects / zoom / LUT) — still + hover canvas */
.cc-live-thumb { position:relative; width:100%; height:100%; }
.cc-live-thumb-still,
.cc-live-thumb-canvas {
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; display:block;
}
.cc-live-thumb-canvas {
  opacity:0; z-index:1; pointer-events:none;
  transition: opacity 80ms linear;
}
.cc-live-thumb-canvas.always-on { opacity:1; }
.cc-live-thumb.is-playing .cc-live-thumb-canvas { opacity:1; }
.cc-live-thumb.is-playing .cc-live-thumb-still { opacity:0; }

.cc-media-pool { position:relative; display:flex; flex:1; min-height:0; flex-direction:column; overflow:hidden; padding:9px 7px 0 12px; background:var(--cc-panel); color:var(--cc-text); }
.cc-media-toolbar { position:relative; z-index:5; display:flex; align-items:center; gap:4px; margin-bottom:10px; }
.cc-media-search { height:24px; min-width:0; flex:1; display:flex; align-items:center; gap:0; margin-right:5px; padding:0 0 0 7px; border:0.5px solid var(--cc-border); border-radius:4px; background:var(--cc-panel); color:var(--cc-text-dim); }
@container library-panel (max-width:320px) {
  .cc-media-toolbar { flex-wrap:wrap; }
  .cc-media-search { flex:1 0 100%; margin-right:0; }
}
.cc-media-search:focus-within { border-color:var(--cc-border); color:var(--cc-text-muted); }
.cc-media-search input { width:100%; height:24px; min-width:0; padding:0; border:0; outline:0; background:transparent; color:var(--cc-text); font-size:12px; line-height:12px; }
.cc-media-search input::placeholder { color:var(--cc-text-dim); }
.cc-media-icon { width:24px; height:24px; display:grid; place-items:center; padding:0; border:0; border-radius:4px; background:transparent; color:rgba(var(--cc-ink-rgb), 0.76); cursor:pointer; }
.cc-media-icon:hover, .cc-media-icon.active { background:var(--cc-hover); color:var(--cc-text); }
.cc-media-icon:disabled { opacity:.45; cursor:default; }
.cc-media-menu-anchor { position:relative; }
.cc-media-popover { position:absolute; z-index:30; padding:5px; border:0.5px solid var(--cc-border); border-radius:5px; background:var(--cc-panel-alt); box-shadow:0 10px 30px rgba(var(--cc-shadow-rgb), 0.67); }
.cc-media-popover button, .cc-media-popover select { width:100%; min-width:120px; display:block; padding:7px 9px; border:0; border-radius:4px; background:transparent; color:rgba(var(--cc-ink-rgb), 0.81); text-align:left; cursor:pointer; font-size:12px; }
.cc-media-popover button:hover, .cc-media-popover button.selected { background:var(--cc-hover); color:var(--cc-text-strong); }
.cc-media-popover select { margin-top:3px; border:0.5px solid var(--cc-border); background:var(--cc-hover); }
.cc-media-sort-menu, .cc-media-filter-menu, .cc-media-actions-menu { top:38px; right:0; }
.cc-media-toolbar-menu-fixed { position:fixed; right:auto; z-index:1000; }
 .cc-media-actions-menu button,.cc-media-menu-label { display:flex; align-items:center; gap:7px; }
.cc-media-solid-icon { width:16px; height:16px; display:grid; place-items:center; border:0.5px solid var(--cc-border); border-radius:3px; font-size:9px; font-weight:700; }
.cc-media-upload-pct { min-width:36px; color:var(--cc-text-dim); font-size:11px; font-variant-numeric:tabular-nums; }
.cc-media-breadcrumb, .cc-media-selection { display:flex; align-items:center; gap:7px; min-height:30px; margin:-4px 0 10px; color:var(--cc-text-dim); font-size:11px; }
.cc-media-breadcrumb span, .cc-media-selection span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cc-media-breadcrumb button, .cc-media-selection button, .cc-media-selection select { padding:4px 7px; border:0.5px solid var(--cc-border); border-radius:5px; background:var(--cc-panel-alt); color:var(--cc-text-muted); cursor:pointer; font-size:10px; }
.cc-media-breadcrumb button:disabled { opacity:.35; cursor:default; }
.cc-media-selection { min-height:34px; padding:0 6px; border:0.5px solid var(--cc-border); border-radius:6px; background:var(--cc-panel-alt); }
.cc-media-status, .cc-media-error { margin:-5px 0 8px; font-size:11px; }
.cc-media-status { color:var(--cc-text-dim); }
.cc-media-error { color:#e27f75; }
.cc-media-export-guide { margin:-4px 0 9px; padding:6px 8px; border:0.5px solid var(--cc-border); border-radius:5px; background:var(--cc-panel-alt); color:var(--cc-text-dim); font-size:10.5px; line-height:1.45; }
.cc-media-grid { position:relative; flex:1; min-height:0; overflow-y:auto; padding:0 0 28px; }
.cc-media-grid.is-marquee-selecting { user-select:none; cursor:crosshair; }
.cc-media-marquee { position:absolute; z-index:4; box-sizing:border-box; pointer-events:none; border:1px solid var(--cc-accent); border-radius:2px; background:color-mix(in srgb,var(--cc-accent) 12%,transparent); }
.cc-media-blank-menu { position:fixed; z-index:95; width:220px; display:flex; flex-direction:column; gap:3px; padding:6px; }
.cc-media-blank-menu > button,.cc-media-blank-menu > label { min-height:30px; display:flex; align-items:center; justify-content:space-between; gap:8px; border:0; border-radius:4px; background:transparent; color:var(--cc-text-muted); padding:0 8px; font-size:12px; text-align:left; }
.cc-media-blank-menu > button:hover:not(:disabled) { background:var(--cc-hover); color:var(--cc-text); }
.cc-media-blank-menu > button:disabled { opacity:.42; }
.cc-media-blank-menu > hr { width:100%; margin:3px 0; border:0; border-top:0.5px solid var(--cc-border); }
.cc-media-blank-menu select { min-width:92px; border:0.5px solid var(--cc-border); border-radius:3px; background:var(--cc-inset); color:var(--cc-text); padding:3px 5px; font-size:11px; }
.cc-media-grid.list { display:block; }
.cc-media-virtual-canvas { position:relative; width:100%; }
.cc-media-virtual-row { position:absolute; left:0; width:100%; display:grid; }
.cc-media-grid.grid .cc-asset-card { width:100%; max-width:104px; height:84px; }
.cc-asset-kind-mark { left:4px; right:auto; font-size:9px; font-weight:700; letter-spacing:.3px; }
.cc-asset-preview-failed {
  position:absolute; left:4px; bottom:4px; width:16px; height:16px; display:grid; place-items:center;
  border-radius:50%; background:var(--cc-danger); color:var(--cc-on-accent); font-size:10px; font-weight:700; pointer-events:none;
}
.cc-asset-card, .cc-folder-card { position:relative; min-width:0; color:var(--cc-text-muted); }
.cc-folder-card,.cc-add-solid-canvas-card {
  width:100%; height:84px; display:grid; grid-template-rows:auto auto; align-content:start;
  box-sizing:border-box; min-width:0; padding:0; border:0; border-radius:6px; background:transparent;
  color:var(--cc-text-dim); cursor:pointer; text-align:left;
}
.cc-media-entry-thumb {
  width:100%; aspect-ratio:16/9; display:grid; place-items:center; box-sizing:border-box;
  border:0.5px solid var(--cc-hover); border-radius:6px; background:var(--cc-hover); color:var(--cc-text-dim);
  transition:background 120ms ease, border-color 120ms ease, color 120ms ease;
}
.cc-media-entry-name {
  display:block; min-width:0; overflow:hidden; padding:7px 4px 0; color:var(--cc-text-muted);
  font-size:12px; font-weight:400; line-height:1.25; white-space:nowrap; text-overflow:ellipsis;
}
.cc-folder-card:hover,.cc-add-solid-canvas-card:hover { background:transparent; color:var(--cc-text-strong); }
.cc-folder-card:hover .cc-media-entry-thumb {
  border-color:var(--cc-border); background:var(--cc-panel-alt); color:var(--cc-text-strong);
}
.cc-folder-card.is-drop-target .cc-media-entry-thumb {
  border-color:var(--cc-accent); background:var(--cc-accent-soft); color:var(--cc-accent);
  box-shadow:0 0 0 1px color-mix(in srgb, var(--cc-accent) 35%, transparent);
}
.cc-parent-folder .cc-media-entry-thumb {

/* Instant tooltip (toolbar): The native title has ~1s browser inherent delay, and it appears immediately when hovering here.

   Replacement elements such as input/select do not support ::after, and those elements still retain their native titles. */

.cc-export-output span,.cc-export-output strong,.cc-export-output small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cc-export-output span { color:var(--cc-text-muted); font-size:9.5px; }

.cc-export-output small { margin-top:2px; color:var(--cc-text-dim); font:9.5px/1.2 Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace; }
.cc-export-cancel { height:34px; padding:0 12px; border:0.5px solid var(--cc-border-light); border-radius:4px; background:var(--cc-bg); color:var(--cc-text-muted); font-size:11px; font-weight:600; cursor:pointer; }
.cc-export-cancel:hover { border-color:var(--cc-text-dim); color:var(--cc-text); }
.cc-export-cta { min-width:130px; height:34px; display:flex; align-items:center; justify-content:center; gap:7px; padding:0 14px; border:0; border-radius:4px; background:var(--cc-accent); color:var(--cc-on-accent); font-size:11.5px; font-weight:700; cursor:pointer; }
.cc-export-cta:hover:not(:disabled) { background:var(--cc-accent-deep); }
.cc-export-cta:disabled { cursor:default; opacity:.5; }
.cc-export-tab:disabled { cursor:default; }
.cc-export-close:focus-visible,.cc-export-tab:focus-visible,.cc-export-select:focus-visible,.cc-export-bitrate-custom:focus-within,.cc-export-seg:focus-visible,.cc-export-destination button:focus-visible,.cc-export-cancel:focus-visible,.cc-export-cta:focus-visible { outline:2px solid var(--cc-accent); outline-offset:2px; }
@media (max-width:720px) {
  .cc-export-overlay { padding:8px; }

  .cc-export-header { min-height:56px; padding:10px 12px; }
  .cc-export-layout { display:block; min-height:0; }
  .cc-export-sidebar { padding:7px; border-right:0; border-bottom:0.5px solid var(--cc-border); }
  .cc-export-sidebar-label { display:none; }
  .cc-export-tabs { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); }
  .cc-export-tab { min-height:36px; justify-content:center; padding:5px 3px; }
  .cc-export-tab-icon { width:24px; height:24px; flex-basis:24px; }
  .cc-export-tab > span:last-child { display:none; }
  .cc-export-main { min-height:340px; }
  .cc-export-content { padding:12px; }
  .cc-export-footer { padding:9px 12px; }
  .cc-export-field { grid-template-columns:1fr; gap:5px; }
  .cc-export-field > span { padding-top:0; }
}
.cc-caption-translate { justify-content:flex-start; gap:6px; }
.cc-caption-translate span:first-child { font-size:11px; opacity:0.75; }
.cc-caption-translate span:last-child { margin-left:auto; font-size:13px; line-height:1; color:var(--cc-text-muted); }
.cc-caption-translate-wrap { position:relative; flex:0 0 auto; }
.cc-caption-language-menu { position:absolute; left:calc(100% + 4px); bottom:0; width:128px; padding:4px; border:0.5px solid var(--cc-border); border-radius:5px; background:var(--cc-panel-alt); box-shadow:0 8px 24px rgba(var(--cc-shadow-rgb), 0.67); }
.cc-caption-language-menu.is-drill { position:static; width:auto; min-height:0; overflow-y:auto; border:0; border-radius:0; box-shadow:none; }
.cc-caption-language-menu button { min-height:26px; padding:3px 8px; font-size:12px; }
.cc-caption-style-error { padding:6px 10px; border-top:0.5px solid var(--cc-border); color:#e98d82; font-size:10px; line-height:1.35; }
.cc-audio-waveform { position:absolute; z-index:0; top:2px; left:3px; width:calc(100% - 6px); height:calc(100% - 20px); overflow:visible; pointer-events:none; opacity:.9; }
.cc-audio-waveform path { fill:none; stroke:#174b2c; stroke-width:1.05; vector-effect:non-scaling-stroke; }
/* Clip media preview layer (ClipMediaLayers): video thumbnail frame bar + true peak sound wave.
   The sound wave color follows the dark green stroke of the audio clip; the sound wave band of the video clip is padded with an audio color.
   Use var(--cc-clip-audio) for skin color. */
.cc-clip-wave { opacity:.9; }
.cc-clip-wave path { fill:none; stroke:#174b2c; stroke-width:1.05; vector-effect:non-scaling-stroke; }
.cc-clip-wave.on-video { background:var(--cc-clip-audio); opacity:.95; }
.cc-clip-label { position:relative; z-index:1; min-width:0; overflow:hidden; color:#f3e7ef; text-overflow:ellipsis; font-weight:600; text-shadow:0 1px 2px #0008; pointer-events:none; }
.cc-clip-label.audio { color:#0d2717; text-shadow:none; }

/* applied-effect markers on timeline clips */
.cc-clip-badges {
  position:absolute; top:3px; right:6px; z-index:2;
  display:flex; flex-wrap:wrap; justify-content:flex-end; gap:3px;
  max-width:calc(100% - 16px); pointer-events:none;
}
.cc-clip-badge {
  font-size:9px; font-weight:700; line-height:1; letter-spacing:0.02em;
  padding:2px 5px; border-radius:3px;
  max-width:96px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  color:#fff; border:0.5px solid rgba(255,255,255,0.22);
  background:rgba(0,0,0,0.55); text-shadow:none;
  white-space:nowrap;
}
.cc-clip-badge.fx { background:#5b3d9aee; border-color:#9b7fd4; }
.cc-clip-badge.lut { background:#8a4b1fee; border-color:#e0a06a; }
.cc-clip-badge.zoom { background:#1f5f8bee; border-color:#6ab0e0; }
.cc-clip-badge.iso { background:#1a6b4aee; border-color:#5dcaa0; }
.cc-clip-badge.tr { background:#3a3f52ee; border-color:#8a9ad0; }

/* transition diamond at cut points */
.cc-transition-marker {
  width:16px; height:16px; border-radius:4px;
  background:#3a3f52; border:0.5px solid #8aa0e0; color:#d8e4ff;
  display:grid; place-items:center; cursor:pointer;
  box-shadow:0 1px 4px #0008;
}
.cc-transition-marker:hover { background:#4a5270; border-color:#b0c4ff; }

.cc-resource-card.draggable { cursor:grab; }
.cc-resource-card.draggable:active { cursor:grabbing; }
.cc-sound-row[draggable="true"] { cursor:grab; }

/* ── AI edit proposal card ─────────────────────────────────────────────── */

  border:0.5px solid rgba(var(--cc-accent-rgb), 0.3); border-radius:3px;
  color:var(--cc-accent); background:rgba(var(--cc-accent-rgb), 0.1);
}
.cc-proposal-titles { min-width:0; flex:1; }
.cc-proposal-title-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-height:26px; }

}

  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}
.cc-proposal-summary.costly { color:color-mix(in srgb, var(--cc-accent) 48%, var(--cc-text)); }
.cc-proposal-impact {
  flex-shrink:0; align-self:flex-start; padding:2px 6px; border:0.5px solid var(--cc-border); border-radius:3px;
  background:var(--cc-panel); color:var(--cc-text-dim); font-size:10px; line-height:15px;
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.cc-proposal-ops-bar {
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  min-height:30px; padding:5px 12px;
  border-top:0.5px solid var(--cc-border); border-bottom:0.5px solid var(--cc-border);
  background:var(--cc-panel);
}
.cc-proposal-ops-label { font-size:11px; color:var(--cc-text-dim); }
.cc-proposal-ops-label strong { color:var(--cc-text); font-weight:650; }
.cc-proposal-ops-actions { display:flex; gap:10px; }
.cc-proposal-link { padding:2px; border:0; background:none; color:var(--cc-text-dim); cursor:pointer; font-size:11px; transition:color .12s; }
.cc-proposal-link:hover:not(:disabled) { color:var(--cc-text); }
.cc-proposal-link:disabled { opacity:.4; cursor:default; }
.cc-proposal button:focus-visible, .cc-widget button:focus-visible {
  outline:2px solid var(--cc-accent); outline-offset:2px;
}
.cc-proposal-list { list-style:none; margin:0; padding:0; max-height:216px; overflow-y:auto; }

.cc-proposal-op.off { opacity:.5; }
.cc-proposal-op.off .cc-proposal-op-action { text-decoration:line-through; color:var(--cc-text-dim); }
.cc-proposal-op-label { display:flex; align-items:flex-start; gap:9px; min-width:0; min-height:42px; padding:8px 12px; cursor:pointer; }
.cc-proposal-check { position:absolute; opacity:0; width:0; height:0; pointer-events:none; }

.cc-proposal-op-body { min-width:0; flex:1; display:flex; flex-direction:column; gap:3px; }
.cc-proposal-op-main { display:flex; align-items:baseline; gap:6px; min-width:0; }
.cc-proposal-op-action { flex-shrink:0; font-size:12px; font-weight:600; color:var(--cc-text); }
.cc-proposal-op-target { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11.5px; color:var(--cc-text-muted); }
.cc-proposal-op-meta { display:flex; align-items:center; gap:7px; min-width:0; }
.cc-proposal-tool {
  padding:1px 4px; border:0.5px solid var(--cc-border); border-radius:3px; background:var(--cc-panel);
  color:var(--cc-text-dim); font-family:Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace; font-size:9.5px;

.cc-proposal-op-impact { margin-left:auto; font-size:10px; color:var(--cc-text-dim); font-variant-numeric:tabular-nums; white-space:nowrap; }

/* ── AI follow-up widget form ──────────────────────────────────────────── */
.cc-widget {
  margin:8px 0; overflow:hidden;
  border:0.5px solid var(--cc-border); border-radius:4px;
  background:var(--cc-panel-alt);
}

.cc-widget-title {
  margin:0; padding:8px 10px; border-bottom:0.5px solid var(--cc-border);
  font-size:13px; line-height:18px; font-weight:650; color:var(--cc-text-strong);
  background:var(--cc-panel);
}
.cc-widget-body { padding:0 8px; }
.cc-widget-field { padding:7px 2px; border-top:0.5px solid var(--cc-border); }
.cc-widget-field.first { border-top:0; }
.cc-widget-field-head {
  display:flex; align-items:center; gap:6px; margin-bottom:5px;
}
.cc-widget-label {
  margin:0; font-size:12.5px; font-weight:600; line-height:18px; color:var(--cc-text);
}
.cc-widget-description { margin:-3px 0 8px; font-size:11px; line-height:1.45; color:var(--cc-text-dim); }
.cc-widget-req, .cc-widget-opt {
  padding:1px 5px; border:0.5px solid var(--cc-border); border-radius:3px;
  font-size:9.5px; font-weight:600; line-height:15px;
}
.cc-widget-req { border-color:rgba(var(--cc-accent-rgb), 0.35); color:color-mix(in srgb, var(--cc-accent) 55%, var(--cc-text)); background:rgba(var(--cc-accent-rgb), 0.07); }
.cc-widget-opt { color:var(--cc-text-dim); background:var(--cc-panel); }
.cc-widget-options { display:flex; flex-direction:column; gap:2px; }
.cc-widget-option {
  position:relative; display:flex; align-items:center; gap:10px;
  min-height:28px; padding:4px 7px; border:0.5px solid transparent; border-radius:3px; cursor:pointer;
  background:transparent; transition:border-color .12s, background .12s;
}
.cc-widget-option:hover:not(.disabled) { background:rgba(var(--cc-ink-rgb), 0.04); }
.cc-widget-option.on {
  border-color:rgba(var(--cc-accent-rgb), 0.35); background:rgba(var(--cc-accent-rgb), 0.07);
}
.cc-widget-option.disabled { cursor:default; }
.cc-widget-option input { position:absolute; opacity:0; width:0; height:0; pointer-events:none; }
.cc-widget-radio, .cc-widget-check {
  width:15px; height:15px; flex:0 0 15px; position:relative;
  border:1px solid var(--cc-border-light); background:var(--cc-inset);
  transition:border-color .12s, background .12s;
}
.cc-widget-radio { border-radius:50%; }
.cc-widget-check { border-radius:3px; }
.cc-widget-option.on .cc-widget-radio { border-color:var(--cc-accent); }
.cc-widget-option.on .cc-widget-radio::after {
  content:""; position:absolute; inset:3px; border-radius:50%;
  background:var(--cc-accent);
}
.cc-widget-option.on .cc-widget-check {
  border-color:var(--cc-accent); background:var(--cc-accent);
}
.cc-widget-option.on .cc-widget-check::after {
  content:""; position:absolute; left:4px; top:1px; width:4px; height:8px;
  border:solid var(--cc-on-accent); border-width:0 1.5px 1.5px 0; transform:rotate(45deg);
}
.cc-widget-option input:focus-visible + .cc-widget-radio,
.cc-widget-option input:focus-visible + .cc-widget-check { outline:2px solid var(--cc-accent); outline-offset:2px; }
.cc-widget-option-text {
  min-width:0; font-size:12px; color:var(--cc-text); line-height:1.35;
}
.cc-widget-option.on .cc-widget-option-text { color:var(--cc-text-strong); font-weight:500; }
.cc-widget-other { flex-wrap:wrap; }
.cc-widget-other-input {
  flex:1 1 120px; min-width:100px; margin-left:2px;
  height:28px; padding:0 10px; border-radius:4px;
  border:0.5px solid var(--cc-border); background:var(--cc-inset); color:var(--cc-text); font-size:12px; outline:0;
}
.cc-widget-other-input:focus { border-color:rgba(var(--cc-accent-rgb), 0.53); box-shadow:0 0 0 2px rgba(var(--cc-accent-rgb), 0.13); }
.cc-widget-other-input:disabled { opacity:.6; }
.cc-widget-text-input {
  display:block; width:100%; min-height:70px; resize:vertical;
  padding:8px 10px; border:0.5px solid var(--cc-border); border-radius:4px;
  background:var(--cc-inset); color:var(--cc-text); font:inherit; font-size:12px; line-height:1.45; outline:0;
}
.cc-widget-text-input:focus { border-color:rgba(var(--cc-accent-rgb), 0.53); box-shadow:0 0 0 2px rgba(var(--cc-accent-rgb), 0.13); }
.cc-widget-text-input:disabled { opacity:.6; }
.cc-widget-visuals { display:flex; flex-direction:column; gap:3px; }
.cc-widget-visual {
  display:flex; align-items:flex-start; gap:10px; width:100%;
  text-align:left; padding:6px 7px; border-radius:3px; cursor:pointer;
  border:0.5px solid transparent; background:transparent; color:inherit;
  transition:border-color .12s, background .12s;
}
.cc-widget-visual:hover:not(:disabled) { background:rgba(var(--cc-ink-rgb), 0.04); }
.cc-widget-visual.on {
  border-color:rgba(var(--cc-accent-rgb), 0.35); background:rgba(var(--cc-accent-rgb), 0.07);
}
.cc-widget-visual:disabled { cursor:default; }
.cc-widget-other-button {
  display:flex; align-items:center; gap:10px; padding:0; border:0;
  background:transparent; color:inherit; cursor:pointer;
}
.cc-widget-other-button:disabled { cursor:default; }
.cc-widget-visual .cc-widget-radio { margin-top:2px; }
.cc-widget-visual.on .cc-widget-radio { border-color:var(--cc-accent); }
.cc-widget-visual.on .cc-widget-radio::after {
  content:""; position:absolute; inset:3px; border-radius:50%;
  background:var(--cc-accent);
}
.cc-widget-visual-body { min-width:0; flex:1; display:flex; flex-direction:column; gap:3px; }
.cc-widget-visual-name { font-size:12px; font-weight:600; color:var(--cc-text); }
.cc-widget-visual-summary { font-size:11px; color:var(--cc-text-dim); line-height:1.4; }
.cc-widget-media-img {

}

.cc-widget-foot {
