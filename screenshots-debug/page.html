.cc-widget-submit {
  margin-left:auto; height:28px; padding:0 12px; border:0; border-radius:3px;
  font-size:11.5px; font-weight:600; color:var(--cc-on-accent); cursor:pointer;
  background:var(--cc-accent);
}
.cc-widget-submit:hover:not(:disabled) { background:var(--cc-accent-deep); }
.cc-widget-submit:disabled {
  opacity:.4; cursor:default; filter:none; box-shadow:none;
}
.cc-widget.submitted .cc-widget-submit {
  opacity:1; background:var(--cc-hover); color:var(--cc-text-muted);
  border:0.5px solid var(--cc-border); box-shadow:none;
}

/* ── Transcript panel ── */
.cc-transcript-panel { display:flex; flex-direction:column; min-height:0; height:100%; }
.cc-transcript-toolbar {
  position:relative; display:flex; align-items:center; gap:8px;
  min-height:36px; padding:4px 12px; border-bottom:0.5px solid var(--cc-border); flex-wrap:wrap; flex-shrink:0;
}
.cc-tx-btn {
  min-height:28px; display:inline-flex; align-items:center; justify-content:center; gap:4px;
  background:var(--cc-panel-alt); color:var(--cc-text-muted); border:0.5px solid var(--cc-border); border-radius:4px;
  padding:4px 9px; font-size:11.5px; cursor:pointer;
}
.cc-tx-btn:hover:not(:disabled) { border-color:var(--cc-border-light); background:var(--cc-hover); color:var(--cc-text-strong); }
.cc-tx-btn:disabled { opacity:0.45; cursor:default; }
.cc-tx-btn.active { background:var(--cc-accent-deep); border-color:var(--cc-accent-deep); color:var(--cc-on-accent); }
.cc-tx-btn.primary { background:var(--cc-accent-deep); border-color:var(--cc-accent-deep); color:var(--cc-on-accent); }
.cc-tx-btn.primary:disabled { opacity:0.55; }
.cc-tx-btn.block { width:100%; justify-content:center; }
.cc-tx-btn.sm { padding:3px 8px; font-size:11px; }
.cc-tx-select {
  min-height:28px; background:var(--cc-panel-alt); color:var(--cc-text); border:0.5px solid var(--cc-border); border-radius:4px;
  padding:4px 8px; font-size:11.5px;
}
.cc-tx-spacer { flex:1; min-width:8px; }
.cc-tx-popover {
  position:absolute; top:42px; left:12px; width:280px; z-index:20;
  background:var(--cc-panel-alt); border:0.5px solid var(--cc-border); border-radius:5px; padding:12px;
  box-shadow:0 8px 24px rgba(var(--cc-shadow-rgb), 0.5);
}
.cc-tx-muted { font-size:11.5px; color:var(--cc-text-dim); line-height:1.45; }
.cc-tx-check {
  display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--cc-text);
  margin:0 0 8px; cursor:pointer;
}
.cc-tx-editbar {
  padding:6px 12px; font-size:11.5px; color:var(--cc-text-dim); border-bottom:0.5px solid var(--cc-border);
  display:flex; align-items:center; gap:10px; flex-shrink:0;
}
.cc-tx-editbar b { color:var(--cc-text); }
.cc-tx-body { flex:1; overflow-y:auto; min-height:0; padding:12px 14px; }
.cc-tx-empty { display:flex; flex-direction:column; gap:6px; max-width:360px; }
.cc-tx-empty-title { font-size:13px; font-weight:600; color:var(--cc-text); margin-bottom:2px; }
.cc-tx-tracks {
  display:flex; flex-wrap:wrap; gap:4px; padding:6px 12px;
  border-bottom:0.5px solid var(--cc-hover); flex-shrink:0; align-items:center;
}
.cc-tx-track-chip {
  min-height:28px; display:inline-flex; align-items:center; gap:6px; max-width:100%;
  padding:3px 8px; border-radius:4px; cursor:pointer;
  border:0.5px solid transparent; background:transparent; color:var(--cc-text-muted); font-size:11.5px;
}
.cc-tx-track-chip:hover { border-color:var(--cc-border); background:var(--cc-panel-alt); color:var(--cc-text); }
.cc-tx-track-chip.selected {
  border-color:color-mix(in srgb, var(--cc-accent) 38%, var(--cc-border));
  background:color-mix(in srgb, var(--cc-accent) 8%, var(--cc-panel)); color:var(--cc-text-strong); font-weight:600;
}
.cc-tx-track-alias { font-variant-numeric:tabular-nums; letter-spacing:0.02em; }
.cc-tx-track-name {
  max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  opacity:0.85; font-weight:400;
}
.cc-tx-track-chip.selected .cc-tx-track-name { opacity:0.78; }
.cc-tx-track-count {
  font-size:10px; min-width:16px; height:16px; padding:0 5px; border-radius:999px;
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--cc-hover); color:var(--cc-text-dim); font-variant-numeric:tabular-nums;
}
.cc-tx-track-chip.selected .cc-tx-track-count { background:color-mix(in srgb, var(--cc-accent) 18%, var(--cc-hover)); color:var(--cc-text-muted); }
.cc-tx-empty-card {
  display:flex; flex-direction:column; gap:8px; max-width:380px;
  padding:8px 2px; border:0; background:transparent;
}
/* No track empty state: no frame centered, small dot icon (reject large icon bricks) */
.cc-tx-empty-card.blank {
  border:none; background:none; padding:0; max-width:230px; margin:56px auto 0;
  align-items:center; text-align:center; gap:4px;
}
.cc-tx-empty-card.blank .cc-tx-empty-icon {
  width:28px; height:28px; border-radius:50%; border:none; background:var(--cc-hover); margin-bottom:4px;
}
.cc-tx-empty-card.blank .cc-tx-empty-title { font-size:12.5px; }
.cc-tx-empty-card.blank .cc-tx-muted { font-size:11px; line-height:1.6; margin:2px 0 0; }
.cc-tx-empty-icon {
  width:40px; height:40px; border-radius:4px; display:grid; place-items:center;
  background:var(--cc-panel-alt); color:var(--cc-text-muted); border:0.5px solid var(--cc-border); margin-bottom:2px;
}
.cc-tx-empty-kicker {
  font-size:10.5px; color:var(--cc-accent); font-weight:600; letter-spacing:0.03em;
}
.cc-tx-empty-title { font-size:13px; font-weight:600; color:var(--cc-text); }
.cc-tx-btn.lg { min-height:32px; padding:5px 12px; font-size:12px; align-self:flex-start; margin-top:2px; }
.cc-tx-check.music { margin-top:4px; color:var(--cc-text-dim); }
.cc-tx-cliplist {
  list-style:none; margin:3px 0 1px; padding:0; display:flex; flex-direction:column;
}
.cc-tx-cliplist li {
  display:flex; align-items:center; gap:8px;
  min-height:30px; padding:5px 7px; border-top:0.5px solid var(--cc-hover); background:transparent;
  font-size:11.5px; color:var(--cc-text-dim);
}
.cc-tx-cliplist li:last-child { border-bottom:0.5px solid var(--cc-hover); }
.cc-tx-clipname { flex:1; color:var(--cc-text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cc-tx-clipdur { font-variant-numeric:tabular-nums; color:var(--cc-text-dim); font-size:11px; }
/* Clip navigator — scales to many VO segments (dropdown + h-scroll chips) */
.cc-tx-nav {
  display:flex; flex-direction:column; gap:8px; margin-bottom:12px;
  position:sticky; top:0; z-index:2; padding-bottom:6px;
  background:linear-gradient(var(--cc-panel) 70%, transparent);
}
.cc-tx-nav-bar {
  display:flex; align-items:center; gap:6px; min-width:0;
}
.cc-tx-nav-select {
  flex:1; min-width:0; height:28px; padding:0 8px;
  border:0.5px solid var(--cc-border); border-radius:4px; background:var(--cc-inset); color:var(--cc-text);
  font-size:11.5px; outline:0;
}
.cc-tx-nav-select:focus { border-color:var(--cc-border-light); }
.cc-tx-nav-step {
  display:inline-flex; align-items:center; gap:2px; flex-shrink:0;
}
.cc-tx-nav-count {
  font-size:11px; color:var(--cc-text-dim); font-variant-numeric:tabular-nums;
  min-width:36px; text-align:center;
}
.cc-tx-nav-mode {
  display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--cc-text-dim); cursor:pointer;
}
.cc-tx-nav-mode input { accent-color:var(--cc-accent-deep); }
.cc-tx-error { font-size:11.5px; color:#f88; margin-top:8px; line-height:1.4; }
.cc-tx-sections { display:flex; flex-direction:column; gap:14px; }
.cc-tx-section {
  padding:10px 10px 12px; border-radius:4px; border:0.5px solid var(--cc-hover); background:var(--cc-inset);
  cursor:default;
}
.cc-tx-section.active { border-color:var(--cc-border-light); background:var(--cc-panel-alt); box-shadow:inset 0 0 0 0.5px rgba(var(--cc-ink-rgb), 0.06); }
.cc-tx-section-head {
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  margin-bottom:8px; padding-bottom:6px; border-bottom:0.5px solid var(--cc-hover);
  min-width:0;
}
.cc-tx-section-title { font-size:12px; font-weight:600; color:var(--cc-text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cc-tx-section-head > .cc-tx-muted {
  flex-shrink:1; min-width:0; max-width:48%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  text-align:right;
}
.cc-tx-section-grip {
  flex-shrink:0; width:16px; color:var(--cc-border-light); font-size:11px; letter-spacing:-1px;
  cursor:default; user-select:none; line-height:1;
}
.cc-tx-section-grip.active { cursor:grab; color:var(--cc-text-dim); }
.cc-tx-section-grip.active:active { cursor:grabbing; }
.cc-tx-section.drag-over { border-color:#6a9fd8; box-shadow:inset 0 0 0 0.5px #6a9fd855; }
.cc-tx-section[draggable="true"] { cursor:default; }
.cc-tx-speech.drag-over { outline:0.5px dashed #6a9fd8; outline-offset:4px; border-radius:6px; }
.cc-tx-grip.active { cursor:grab; color:var(--cc-text-dim); }
.cc-tx-grip.active:active { cursor:grabbing; }

/* Script view: speaker blocks + gap rows */
.cc-tx-script { display:flex; flex-direction:column; gap:14px; }
.cc-tx-speech {
  display:flex; flex-direction:column; gap:6px;
  /* Long transcripts render thousands of word spans. content-visibility skips
     layout AND paint for blocks scrolled out of view while KEEPING them in the
     DOM — unlike unmount-based virtualization, which would break cross-block
     text selection (the agent's transcript references come from DOM ranges),
     find-in-page, and drag-reorder. `auto` in contain-intrinsic-size makes the
     browser remember each block's last measured height, so the scrollbar does
     not jump as blocks enter and leave. */
  content-visibility:auto;
  contain-intrinsic-size:auto 72px;
}
.cc-tx-speech-label {
  font-size:13px; font-weight:600; letter-spacing:0.01em;
}
.cc-tx-speech-body {
  display:flex; align-items:flex-start; gap:8px;
  font-size:13.5px; line-height:1.75; color:var(--cc-text);
}
.cc-tx-grip {
  flex-shrink:0; width:14px; margin-top:2px;
  color:var(--cc-border-light); font-size:11px; letter-spacing:-1px; cursor:grab; user-select:none;
  line-height:1.4;
}
.cc-tx-words { flex:1; min-width:0; }
.cc-tx-word {
  cursor:pointer; border-radius:3px; padding:0 1px;
}
.cc-tx-word.editable:hover { background:#7a2f2f88; }
.cc-tx-word.del { text-decoration:line-through; opacity:0.38; }
.cc-tx-gap-wrap { display:flex; flex-direction:column; align-items:center; gap:6px; padding:2px 0 4px; }
.cc-tx-gap {
  display:inline-flex; align-items:center; gap:2px;
  min-width:min(100%, 280px); max-width:100%;
  border:0.5px dashed var(--cc-border-light); border-radius:999px;
  background:var(--cc-panel-alt); color:var(--cc-text-muted);
  overflow:hidden;
}
.cc-tx-gap-wrap.removed .cc-tx-gap { opacity:0.55; border-style:solid; border-color:var(--cc-border); }
.cc-tx-gap-main {
  flex:1; min-width:0; border:0; background:transparent; color:inherit;
  font-size:12px; padding:8px 14px; cursor:pointer; text-align:center;
  font-variant-numeric:tabular-nums;
}
.cc-tx-gap-main:hover { color:var(--cc-text-muted); }
.cc-tx-gap-del {
  flex-shrink:0; width:36px; height:34px; border:0; border-left:0.5px solid var(--cc-border);
  background:transparent; color:var(--cc-text-dim); cursor:pointer;
  display:grid; place-items:center; font-size:11px;
}
.cc-tx-gap-del:hover { color:#e8a0a0; background:#2a1a1a; }
.cc-tx-gap-adjust {
  display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px;
  padding:2px 4px 4px;
}
.cc-tx-btn.ghost { background:transparent; color:var(--cc-text-dim); }

/* ── Captions controls (script bottom, foldable) ── */
.cc-cap-panel {
  border-top:0.5px solid var(--cc-border); padding:0;
  display:flex; flex-direction:column; gap:0; flex-shrink:0;
}
.cc-cap-panel.open { padding-bottom:8px; }
.cc-captions-workspace { container-type:inline-size; display:flex; flex:1; flex-direction:column; min-height:0; border-top:0.5px solid var(--cc-border); }
.cc-captions-context { flex:0 0 auto; padding:5px 12px; border-bottom:0.5px solid var(--cc-border); }
.cc-captions-sourcebar { min-height:34px; display:grid; grid-template-columns:64px minmax(0, 1fr) auto; align-items:center; gap:8px; color:var(--cc-text-dim); font-size:10.5px; }
.cc-captions-sourcebar label { color:var(--cc-text-muted); }
.cc-captions-sourcebar .cc-cap-select { width:100%; max-width:none; }
.cc-captions-sourcebar > span { max-width:96px; overflow:hidden; color:var(--cc-text-dim); text-overflow:ellipsis; white-space:nowrap; }
.cc-cap-panel.standalone { flex:1; min-height:0; overflow-y:auto; border-top:0; }
.cc-cap-head-btn {
  width:100%; display:flex; align-items:center; gap:8px;
  min-height:34px; padding:5px 12px; background:none; border:0; cursor:pointer;
  color:var(--cc-text-muted); text-align:left;
}
.cc-cap-head-btn:hover { background:var(--cc-panel-alt); color:var(--cc-text); }
.cc-cap-chevron { display:inline-flex; transition:transform 0.12s; color:var(--cc-text-dim); }
.cc-cap-chevron.closed { transform:rotate(-90deg); }
.cc-cap-title { font-size:12px; font-weight:600; color:var(--cc-text); }
.cc-cap-status { flex:1; min-width:0; font-size:11px; color:var(--cc-text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cc-cap-head-action { font-size:11px; color:var(--cc-text-dim); flex-shrink:0; }
.cc-cap-panel.collapsed .cc-cap-head-btn { padding:5px 12px; }
.cc-cap-empty, .cc-cap-body {
  padding:8px 12px; display:flex; flex-direction:column;
}
.cc-cap-body { gap:0; }
.cc-cap-empty { gap:8px; }
.cc-cap-empty-actions { display:flex; align-items:center; gap:6px; }
.cc-cap-row.main {
  min-height:36px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
  padding:0 0 7px;
}
.cc-cap-row-actions { display:flex; gap:4px; }
.cc-cap-toggle {
  min-height:28px; display:inline-flex; align-items:center; gap:7px; font-size:11.5px; color:var(--cc-text); cursor:pointer;
}
.cc-cap-toggle input { width:14px; height:14px; margin:0; accent-color:var(--cc-accent); }
.cc-cap-field { display:flex; flex-direction:column; gap:6px; padding:9px 0; border-top:0.5px solid var(--cc-hover); }
.cc-cap-label { font-size:10.5px; color:var(--cc-text-muted); font-weight:600; letter-spacing:0.01em; }
.cc-cap-hint { font-size:10.5px; color:var(--cc-text-dim); line-height:1.4; margin:0; }
.cc-cap-hint.warn { color:color-mix(in srgb, var(--cc-gold) 60%, var(--cc-text-muted)); }
.cc-cap-hint strong { color:var(--cc-text-muted); font-weight:600; }
.cc-cap-error { font-size:11px; color:#f88; }
.cc-cap-btn {
  min-height:30px; display:inline-flex; align-items:center; justify-content:center;
  border:0.5px solid var(--cc-border); background:var(--cc-panel-alt); color:var(--cc-text-muted); border-radius:4px;
  padding:4px 10px; font-size:11.5px; cursor:pointer; text-align:center;
}
.cc-cap-btn:hover:not(:disabled) { border-color:var(--cc-border-light); background:var(--cc-hover); color:var(--cc-text-strong); }
.cc-cap-btn:disabled { opacity:0.45; cursor:default; }
.cc-cap-btn.primary { background:var(--cc-accent-deep); border-color:var(--cc-accent-deep); color:var(--cc-on-accent); }
.cc-cap-btn.sm { min-height:26px; padding:3px 8px; font-size:11px; }
.cc-cap-btn.ghost { background:transparent; color:var(--cc-text-dim); }
.cc-cap-body > .cc-cap-btn { align-self:flex-start; margin:8px 0; }
.cc-cap-styles {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:3px;
  max-height:174px; overflow-y:auto; padding:1px;
}
.cc-cap-style {
  min-width:0; min-height:38px; display:flex; align-items:center; gap:6px;
  padding:4px 6px; border-radius:4px; border:0.5px solid transparent; background:transparent;
  cursor:pointer; color:var(--cc-text-muted); text-align:left;
}
.cc-cap-style:hover { border-color:var(--cc-border); background:var(--cc-panel-alt); color:var(--cc-text); }
.cc-cap-style.selected { border-color:color-mix(in srgb, var(--cc-accent) 42%, var(--cc-border)); background:color-mix(in srgb, var(--cc-accent) 8%, var(--cc-panel)); color:var(--cc-text-strong); }
.cc-cap-swatch {
  width:24px; height:20px; flex:0 0 24px; border-radius:3px; border:0.5px solid var(--cc-border);
  display:grid; place-items:center; font-size:10px; font-weight:700;
}
.cc-cap-style-name { min-width:0; font-size:10.5px; line-height:1.2; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cc-cap-pills { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); overflow:hidden; border:0.5px solid var(--cc-border); border-radius:4px; }
.cc-cap-pill {
  min-height:28px; padding:4px 9px; border:0; border-right:0.5px solid var(--cc-border); background:transparent;
  color:var(--cc-text-dim); font-size:11px; cursor:pointer;
}
.cc-cap-pill:last-child { border-right:0; }
.cc-cap-pill:hover { background:var(--cc-panel-alt); color:var(--cc-text); }
.cc-cap-pill.selected { background:var(--cc-hover); color:var(--cc-text-strong); font-weight:600; }
.cc-cap-bilingual { border-top:0.5px solid var(--cc-hover); }
.cc-cap-bilingual-toggle {
  width:100%; min-height:36px; display:flex; justify-content:space-between; align-items:center;
  background:none; border:0; border-radius:3px; color:var(--cc-text-muted); font-size:11.5px; cursor:pointer; padding:5px 2px;
}
.cc-cap-bilingual-toggle:hover { background:var(--cc-panel-alt); color:var(--cc-text); }
.cc-cap-bilingual-toggle[aria-expanded="true"] { color:var(--cc-text); }
.cc-cap-bilingual-body { display:flex; flex-direction:column; gap:7px; padding:2px 2px 10px; }
.cc-cap-translate-row { display:flex; gap:6px; align-items:center; }
.cc-cap-select {
  flex:1; min-width:0; height:28px; background:var(--cc-panel-alt); color:var(--cc-text); border:0.5px solid var(--cc-border);
  border-radius:4px; padding:3px 8px; font-size:11.5px;
}
.cc-cap-select:hover { border-color:var(--cc-border-light); }
.cc-cap-input {
  min-width:0; height:28px; box-sizing:border-box; padding:3px 7px;
  border:0.5px solid var(--cc-border); border-radius:4px; outline:0;
  background:var(--cc-inset); color:var(--cc-text); font:inherit; font-size:11.5px;
}
.cc-cap-input:hover { border-color:var(--cc-border-light); }
.cc-cap-input:focus,.cc-cap-input.active { border-color:var(--cc-accent); }
.cc-cap-textarea { width:100%; min-height:52px; height:auto; resize:vertical; padding:6px 7px; line-height:1.4; }
.cc-cap-manual-toolbar { display:flex; align-items:center; gap:4px; }
.cc-cap-manual-toolbar .cc-cap-select { min-width:96px; }
.cc-cap-manual-compose { display:flex; flex-direction:column; gap:7px; }
.cc-cap-manual-controls { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
.cc-cap-time-field { display:inline-flex; align-items:center; gap:4px; color:var(--cc-text-dim); font-size:10.5px; }
.cc-cap-time-field .cc-cap-input { width:58px; font-variant-numeric:tabular-nums; }
.cc-cap-manual-list { display:flex; flex-direction:column; gap:4px; }
.cc-cap-manual-row { display:grid; grid-template-columns:64px 64px minmax(90px, 1fr); align-items:center; gap:4px; }
.cc-cap-manual-actions { grid-column:1 / -1; }
.cc-cap-manual-actions,.cc-cap-cue-actions { display:flex; align-items:center; gap:4px; }
.cc-cap-cues { display:flex; flex-direction:column; gap:6px; padding-bottom:8px; }
.cc-cap-cue-list { max-height:300px; overflow-y:auto; display:flex; flex-direction:column; gap:1px; }
.cc-cap-cue-row { display:flex; align-items:flex-start; gap:5px; border-top:0.5px solid transparent; }
.cc-cap-cue-row:hover { border-top-color:var(--cc-hover); background:var(--cc-panel-alt); }
.cc-cap-cue-time,.cc-cap-cue-text {
  min-height:28px; display:flex; align-items:center; border:0; border-radius:3px; background:transparent;
  color:var(--cc-text); cursor:pointer; font:inherit; font-size:11.5px; line-height:1.4; text-align:left;
}
.cc-cap-cue-time { flex:0 0 auto; padding:4px 3px; color:var(--cc-text-dim); font-size:10.5px; font-variant-numeric:tabular-nums; }
.cc-cap-cue-text { flex:1; min-width:0; padding:4px 6px; }
.cc-cap-cue-time:hover,.cc-cap-cue-text:hover { color:var(--cc-text-strong); }
.cc-cap-cue-edit { flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; padding:3px 2px 6px; }
@container (min-width:500px) {
  .cc-cap-manual-row { grid-template-columns:64px 64px minmax(100px, 1fr) auto; }
  .cc-cap-manual-actions { grid-column:auto; }
}

/* ── Preview workspace and right-docked inspector ── */
.cc-preview-workspace {
  display:flex; position:relative; min-height:0; min-width:0; overflow:hidden;
  container:preview-workspace / inline-size;
}
.cc-inspector {
  width:320px; border-left:0.5px solid var(--cc-border); background:var(--cc-panel);
  display:flex; flex-direction:column; min-height:0;
  flex:0 0 320px;
  overflow:hidden;
}
.cc-inspector:not(.collapsed) .cc-insp-body { min-height:72px; }
.cc-insp-header {
  display:flex; align-items:center; gap:7px; width:100%; min-height:42px; text-align:left;
  padding:6px 10px; color:var(--cc-text-muted); background:none; border:none;
  border-bottom:0.5px solid var(--cc-border); cursor:pointer; flex-shrink:0;
}
.cc-insp-header:hover { color:var(--cc-text); background:var(--cc-hover); }
.cc-insp-chevron { display:inline-flex; transform:rotate(-90deg); transition:transform 0.12s; }
.cc-insp-chevron.closed { transform:rotate(90deg); }
.cc-insp-heading { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
.cc-insp-title { color:var(--cc-text-strong); font-size:11.5px; font-weight:650; line-height:14px; }
.cc-insp-title-name {
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  color:var(--cc-text-dim); font-size:10px; line-height:13px;
}
.cc-insp-pill {
  font-size:9.5px; color:color-mix(in srgb, var(--cc-success) 65%, var(--cc-text-strong)); border:0.5px solid color-mix(in srgb, var(--cc-success) 40%, var(--cc-border)); border-radius:4px;
  padding:1px 5px; background:color-mix(in srgb, var(--cc-success) 10%, var(--cc-panel));
}
.cc-insp-tabs { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); flex-shrink:0; padding:0 8px; border-bottom:0.5px solid var(--cc-border); background:var(--cc-panel); }
.cc-insp-tabs button { min-width:0; height:33px; padding:0 3px; border:0; border-bottom:2px solid transparent; background:transparent; color:var(--cc-text-muted); font-size:11px; cursor:pointer; }
.cc-insp-tabs button:hover:not(:disabled) { color:var(--cc-text-strong); background:var(--cc-hover); }
.cc-insp-tabs button.active { border-bottom-color:var(--cc-accent); color:var(--cc-text-strong); font-weight:650; }
.cc-insp-tabs button:disabled { opacity:.28; cursor:default; }
.cc-insp-tabs button:focus-visible { outline:2px solid var(--cc-accent); outline-offset:-3px; }
.cc-insp-body { flex:1; overflow-y:auto; padding:9px 10px 14px; min-height:0; }
.cc-insp-groups { display:flex; flex-direction:column; gap:5px; }
.cc-insp-section {
  font-size:10.5px; font-weight:650; color:var(--cc-text-muted);
  margin-top:9px; padding-top:7px; border-top:0.5px solid var(--cc-border);
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.cc-insp-groups > .cc-insp-section:first-child { margin-top:0; }
.cc-insp-scope {
  display:flex; align-items:flex-start; gap:7px; padding:7px 8px; margin-bottom:2px;
  border:0.5px solid var(--cc-border); border-radius:4px; background:var(--cc-inset);
  color:var(--cc-text-muted); font-size:10.5px; line-height:1.4;
}
.cc-insp-scope-kind {
  flex-shrink:0; padding:0 5px; border:0.5px solid var(--cc-border-light); border-radius:3px;
  color:var(--cc-text-strong); background:var(--cc-panel); font-size:9.5px; font-weight:650; line-height:16px;
}
.cc-insp-muted { font-size:11px; color:var(--cc-text-dim); }
@container preview-workspace (max-width:720px) {
  .cc-inspector {
    position:absolute; inset:0 0 0 auto; z-index:12;
    width:min(320px, 55%); box-shadow:-12px 0 28px color-mix(in srgb, var(--cc-bg) 55%, transparent);
  }
}
.cc-insp-stack { display:flex; flex-direction:column; gap:6px; }
.cc-insp-control-line {
  display:flex; align-items:center; gap:4px; margin:0 -4px; padding:2px 4px;
  border-radius:4px; transition:background 120ms ease;
}
.cc-insp-control-line:hover { background:var(--cc-hover); }
.cc-insp-row {
  display:grid; grid-template-columns:44px minmax(54px, 1fr) 76px; align-items:center; gap:7px;
  font-size:11px; color:var(--cc-text-muted); min-height:28px;
}
@container preview-workspace (max-width:480px) {
  .cc-insp-header { padding-inline:8px; }
  .cc-insp-body { padding:8px; }
  .cc-insp-row { grid-template-columns:36px minmax(44px, 1fr) 54px; gap:4px; }
}
.cc-insp-label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--cc-text-muted); }
.cc-insp-val {
  display:flex; align-items:center; justify-content:flex-end; gap:3px; min-width:0;
  text-align:right; font-variant-numeric:tabular-nums; color:var(--cc-text-muted); font-size:10.5px;
}
.cc-insp-range {
  --cc-insp-range-fill:0%;
  width:100%; height:16px; margin:0; appearance:none; background:transparent; cursor:pointer;
}
.cc-insp-range::-webkit-slider-runnable-track {
  height:2px; border-radius:999px;
  background:linear-gradient(to right, var(--cc-accent) 0 var(--cc-insp-range-fill), var(--cc-border-light) var(--cc-insp-range-fill) 100%);
}
.cc-insp-range::-webkit-slider-thumb {
  -webkit-appearance:none; width:6px; height:6px; margin-top:-2px; border:0; border-radius:50%;
  background:var(--cc-accent);
}
.cc-insp-range::-moz-range-track {
  height:2px; border:0; border-radius:999px; background:var(--cc-border-light);
}
.cc-insp-range::-moz-range-progress {
  height:2px; border-radius:999px; background:var(--cc-accent);
}
.cc-insp-range::-moz-range-thumb {
  width:6px; height:6px; border:0; border-radius:50%; background:var(--cc-accent);
}
.cc-insp-scalar, .cc-insp-number {
  width:54px; height:24px; padding:1px 4px; border:0.5px solid var(--cc-border); border-radius:4px;
  background:var(--cc-inset); color:var(--cc-text); font:inherit; font-variant-numeric:tabular-nums; text-align:right;
}
.cc-insp-scalar { cursor:ew-resize; }
.cc-insp-scalar:hover, .cc-insp-number:hover { border-color:var(--cc-border-light); }
.cc-insp-scalar:focus-visible, .cc-insp-number:focus {
  background:var(--cc-inset); border-color:var(--cc-accent); outline:1px solid color-mix(in srgb, var(--cc-accent) 28%, transparent);
}
.cc-insp-reset, .cc-insp-group-reset {
  border:0; background:none; color:var(--cc-text-dim); cursor:pointer;
}
.cc-insp-reset {
  width:17px; height:20px; padding:0; border-radius:4px;
  display:grid; place-items:center;
}
.cc-insp-reset:hover:not(:disabled), .cc-insp-group-reset:hover:not(:disabled) {
  color:var(--cc-text); background:var(--cc-hover);
}
.cc-insp-reset:disabled, .cc-insp-group-reset:disabled { opacity:0.28; cursor:default; }
.cc-insp-group-reset {
  padding:1px 4px; border-radius:3px; font-size:9.5px; letter-spacing:0; text-transform:none;
}
.cc-insp-kf { display:inline-flex; align-items:center; gap:1px; flex-shrink:0; }
.cc-insp-kf-btn {
  width:24px; height:24px; padding:0; display:grid; place-items:center;
  border:0.5px solid transparent; border-radius:3px; background:transparent;
  color:var(--cc-text-muted); cursor:pointer;
}
.cc-insp-kf-btn:hover:not(:disabled) { color:var(--cc-text-strong); border-color:var(--cc-border-light); background:var(--cc-hover); }
.cc-insp-kf-btn:focus-visible { outline:2px solid var(--cc-accent); outline-offset:1px; }
.cc-insp-kf-btn:disabled { opacity:.18; cursor:default; }
.cc-insp-kf-btn.danger:disabled { opacity:0; }
.cc-insp-kf-btn.key:not(:disabled) { color:var(--cc-text-strong); border-color:var(--cc-border); background:var(--cc-panel-alt); }
.cc-insp-kf-btn.key.keyed { color:var(--cc-text-muted); }
.cc-insp-kf-btn.key.active { color:var(--cc-accent); border-color:rgba(var(--cc-accent-rgb), .36); background:rgba(var(--cc-accent-rgb), .1); }
.cc-insp-kf-btn.danger:hover:not(:disabled) { color:var(--cc-danger); }
.cc-insp-kf-easing {
  max-width:54px; height:20px; padding:0 2px; border:0.5px solid var(--cc-border-light); border-radius:3px;
  background:var(--cc-bg); color:var(--cc-text-muted); font-size:9px;
}
.cc-insp-select {
  flex:1; min-width:0; background:var(--cc-inset); color:var(--cc-text); border:0.5px solid var(--cc-border);
  border-radius:4px; padding:2px 6px; font-size:11px;
}
.cc-insp-actions { display:flex; align-items:center; gap:8px; margin-top:2px; }
.cc-insp-btn {
  display:inline-flex; align-items:center; gap:4px;
  background:var(--cc-panel-alt); border:0.5px solid var(--cc-border); border-radius:5px; color:var(--cc-text);
  cursor:pointer; font-size:11px; padding:3px 8px;
}
.cc-insp-btn:hover { border-color:var(--cc-border-light); }
.cc-insp-btn:disabled { opacity:0.45; cursor:not-allowed; }
.cc-insp-btn.primary { background:var(--cc-accent); border-color:var(--cc-accent); color:var(--cc-on-accent); }
.cc-auto-grade {
  display:flex; flex-direction:column; gap:6px; padding:8px; margin-bottom:3px;
  background:var(--cc-inset); border:0.5px solid var(--cc-border); border-radius:6px;
}
.cc-auto-grade.previewing { border-color:color-mix(in srgb, var(--cc-accent) 55%, var(--cc-border)); }
.cc-auto-grade-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.cc-auto-grade-head > div { display:flex; align-items:baseline; gap:6px; min-width:0; }
.cc-auto-grade-head strong { color:var(--cc-text); font-size:11px; }
.cc-auto-grade-head span { color:var(--cc-text-dim); font-size:9.5px; }
.cc-auto-grade-note { color:var(--cc-text-dim); font-size:9.5px; line-height:1.45; }
.cc-auto-grade-result { color:var(--cc-text-muted); font-size:9.5px; line-height:1.45; }
.cc-auto-grade-result b { color:var(--cc-text); }
.cc-insp-mg-grid {
  display:flex; flex-direction:column; gap:8px;
}
.cc-insp-mg-field {
  min-width:0; display:flex; flex-direction:column; gap:3px; font-size:10.5px; color:var(--cc-text-dim);
}
.cc-insp-textarea {
  box-sizing:border-box; min-height:29px; max-height:96px;
  field-sizing:content; overflow-y:auto; line-height:16px;
}
.cc-insp-color-row {
  display:grid; grid-template-columns:repeat(auto-fit, minmax(64px, 1fr)); gap:8px;
}
.cc-insp-color-row input[type="color"] {
  width:100%; height:28px; min-width:0; padding:2px;
  border:0.5px solid var(--cc-border); border-radius:4px;
  background:var(--cc-inset); cursor:pointer;
}
.cc-insp-color-row input[type="color"]::-webkit-color-swatch-wrapper {
  padding:1px;
}
.cc-insp-color-row input[type="color"]::-webkit-color-swatch {
  border:0; border-radius:2px;
}
.cc-insp-mg-field input[type="text"],
.cc-insp-mg-field input[type="number"] {
  width:100%; padding:4px 6px; background:var(--cc-inset); color:var(--cc-text);
  border:0.5px solid var(--cc-border); border-radius:4px; font-size:11px;
}

/* Audio FX extras */
.cc-audiofx-strength {
  display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--cc-text-dim); margin-top:8px;
}
.cc-audiofx-strength input { width:100%; accent-color:#6a9fd8; }
.cc-audiofx-actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.cc-audiofx-btn {
  border:0.5px solid var(--cc-border); background:var(--cc-panel-alt); color:var(--cc-text); border-radius:6px;
  padding:6px 12px; font-size:12px; cursor:pointer;
}
.cc-audiofx-btn.primary { background:var(--cc-accent-deep); border-color:var(--cc-accent-deep); color:var(--cc-on-accent); }
.cc-audiofx-btn:disabled { opacity:0.5; cursor:default; }
.cc-audiofx-badge.on { color:color-mix(in srgb, var(--cc-success) 65%, var(--cc-text-strong)); border-color:color-mix(in srgb, var(--cc-success) 40%, var(--cc-border)); background:color-mix(in srgb, var(--cc-success) 10%, var(--cc-panel)); }
.cc-audiofx-note.ok { color:color-mix(in srgb, var(--cc-success) 65%, var(--cc-text-strong)); }
.cc-audiofx-note.err { color:#f88; }

/* Assistant chat markdown (react-markdown + remark-gfm output) */
.cc-md > :first-child { margin-top: 0; }
.cc-md > :last-child { margin-bottom: 0; }
.cc-md p { margin: 0 0 10px; }
.cc-md h1, .cc-md h2, .cc-md h3, .cc-md h4 { margin: 12px 0 8px; font-weight: 600; color: var(--cc-text); line-height: 1.35; }
.cc-md h1 { font-size: 16px; }
.cc-md h2 { font-size: 15px; }
.cc-md h3 { font-size: 14px; }
.cc-md h4 { font-size: 13px; }
.cc-md ul, .cc-md ol { margin: 0 0 10px; padding-left: 22px; }
.cc-md li { margin-bottom: 4px; }
.cc-md li > p { margin: 0; }
.cc-md a { color: var(--cc-accent); text-decoration: underline; }
.cc-md strong { font-weight: 600; color: var(--cc-text); }
.cc-md em { font-style: italic; color: var(--cc-text); }
.cc-md hr { border: 0; border-top: 0.5px solid var(--cc-border); margin: 12px 0; }
.cc-md code { font-family: Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; background: var(--cc-hover); color: color-mix(in srgb, var(--cc-gold) 75%, var(--cc-text-strong)); padding: 1px 5px; border-radius: 4px; border: 0.5px solid var(--cc-border); }
.cc-md pre { margin: 0 0 10px; padding: 10px 12px; border-radius: 4px; background: var(--cc-panel-alt); border: 0.5px solid var(--cc-border); overflow-x: auto; }
.cc-md pre code { background: none; border: 0; padding: 0; color: var(--cc-text); font-size: 12px; line-height: 1.45; }
/* GFM tables: preserve column geometry and scroll inside the narrow chat pane. */
.cc-md-table-scroll { max-width:100%; margin:0 0 10px; overflow-x:auto; border-bottom:0.5px solid var(--cc-border); }
.cc-md-table-scroll:focus-visible { outline:1px solid var(--cc-accent); outline-offset:1px; }
.cc-md table { width:max-content; min-width:100%; border-collapse:collapse; font-size:12.5px; line-height:1.45; }
.cc-md th, .cc-md td { padding:5px 10px; border-bottom:0.5px solid var(--cc-hover); text-align:left; vertical-align:top; overflow-wrap:normal; word-break:normal; }
.cc-md th { color: var(--cc-text); font-weight: 600; border-bottom: 0.5px solid var(--cc-border); white-space: nowrap; }
.cc-md td:first-child { white-space:nowrap; }
.cc-md blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 2px solid var(--cc-border); color: var(--cc-text-muted); }

/* ── Canvas caption direct editing (CaptionPreviewEditor): check box + floating toolbar ─────────────
   All tokens are used, depending on the skin; black background elements are limited to the "video screen context" (textarea bottom in edit state) and remain in the component. */
.cc-capedit-hit { position:relative; }
/* Captions are usually only a few tens of pixels wide; expand the transparent hit zone to avoid having to hit a glyph exactly. */
.cc-capedit-hit::before {
  content:""; position:absolute; inset:-8px -12px; border-radius:6px;
}
.cc-capedit-hit:hover::before { background:rgba(var(--cc-accent-rgb), 0.07); }
.cc-capedit-frame {
  position:absolute; inset:-5px; border-radius:3px; pointer-events:none;
  border:1.5px solid var(--cc-accent);
  box-shadow:0 0 0 3px rgba(var(--cc-accent-rgb), 0.18);
}
.cc-capedit-bar {
  position:absolute; bottom:calc(100% + 12px); left:50%; transform:translateX(-50%);
  /* The toolbar is hung in the caption block and must be explicitly returned to the application UI font - otherwise it will inherit the font/font weight of the caption preset (such as white on black background 700) and make all members bold */
  font-family:Geist, system-ui, -apple-system, sans-serif; font-weight:400; letter-spacing:normal; text-transform:none;
  display:flex; align-items:center; gap:1px; padding:3px;
  border-radius:4px; background:var(--cc-panel); border:0.5px solid var(--cc-border);
  box-shadow:0 8px 26px rgba(var(--cc-shadow-rgb), 0.35), inset 0 1px 0 rgba(var(--cc-ink-rgb), 0.05);
  pointer-events:auto; z-index:5; white-space:nowrap;
}
.cc-capedit-btn {
  display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 9px;
  border:none; border-radius:3px; background:transparent; cursor:pointer;
  color:var(--cc-text); font-size:12px; line-height:1; font-variant-numeric:tabular-nums;
  transition:background .12s, color .12s;
}
.cc-capedit-btn:hover { background:var(--cc-hover); }
.cc-capedit-btn.on { background:color-mix(in srgb, var(--cc-accent) 8%, var(--cc-hover)); color:var(--cc-text-strong); }
.cc-capedit-btn.ai { color:color-mix(in srgb, var(--cc-accent) 62%, var(--cc-text-strong)); }
.cc-capedit-btn.danger { color:var(--cc-text-dim); }
.cc-capedit-btn.danger:hover { color:#e8a0a0; background:#2a1a1a; }
.cc-capedit-divider { width:1px; height:15px; margin:0 2px; background:rgba(var(--cc-ink-rgb), 0.12); flex:0 0 1px; }
.cc-capedit-colordot {
  width:13px; height:13px; border-radius:50%;
  border:1.5px solid rgba(var(--cc-ink-rgb), 0.35); box-shadow:inset 0 0 0 1px rgba(0, 0, 0, 0.18);
}
.cc-capedit-pop {
  position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%);
  font-family:Geist, system-ui, -apple-system, sans-serif; font-weight:400; letter-spacing:normal; text-transform:none;
  padding:5px; border-radius:4px; background:var(--cc-panel-alt); border:0.5px solid var(--cc-border);
  box-shadow:0 10px 30px rgba(var(--cc-shadow-rgb), 0.4);
}
.cc-capedit-pop.styles { display:grid; grid-template-columns:repeat(3, 1fr); gap:3px; width:296px; max-height:198px; overflow-y:auto; }
.cc-capedit-styleitem {
  border:0.5px solid transparent; border-radius:3px; background:transparent; cursor:pointer;
  padding:6px 4px; font-size:11.5px; color:var(--cc-text); text-align:center; transition:background .12s, border-color .12s;
}
.cc-capedit-styleitem:hover { background:var(--cc-hover); }
.cc-capedit-styleitem.on { border-color:color-mix(in srgb, var(--cc-accent) 42%, var(--cc-border)); background:rgba(var(--cc-accent-rgb), 0.08); color:var(--cc-text-strong); }
.cc-capedit-pop.color { display:flex; align-items:center; gap:6px; }
.cc-capedit-swatch {
  width:20px; height:20px; border-radius:50%; cursor:pointer; padding:0;
  border:1.5px solid rgba(var(--cc-ink-rgb), 0.25); transition:transform .1s, box-shadow .12s;
}
.cc-capedit-swatch:hover { transform:scale(1.12); }
.cc-capedit-swatch.on { box-shadow:0 0 0 2px var(--cc-panel), 0 0 0 3.5px var(--cc-accent); }
.cc-capedit-custom { display:inline-flex; align-items:center; gap:5px; margin-left:2px; cursor:pointer; color:var(--cc-text-dim); font-size:11px; }
.cc-capedit-custom:hover { color:var(--cc-text); }
.cc-capedit-custom input[type=color] {
  width:20px; height:20px; padding:0; border:0.5px solid var(--cc-border-light); border-radius:4px;
  background:transparent; cursor:pointer;
}
.cc-preview-transform-overlay {
  position:absolute; inset:0; z-index:3; overflow:visible;
  touch-action:none; user-select:none;
}
.cc-preview-transform-overlay:focus { outline:none; }
.cc-preview-transform-overlay:focus-visible { outline:1px solid var(--cc-accent); outline-offset:-1px; }
.cc-preview-transform-outline {
  position:absolute; inset:0; width:100%; height:100%; overflow:visible;
  pointer-events:none;
}
.cc-preview-transform-handle {
  position:absolute; z-index:1; width:12px; height:12px; margin:-6px 0 0 -6px; padding:0;
  border:1px solid var(--cc-accent); background:var(--cc-panel); box-shadow:0 1px 3px rgba(var(--cc-shadow-rgb),0.28);
}
.cc-preview-transform-handle:focus-visible { outline:2px solid var(--cc-accent); outline-offset:2px; }
.cc-preview-transform-scale { border-radius:2px; }
.cc-preview-transform-scale-0,.cc-preview-transform-scale-2 { cursor:nwse-resize; }
.cc-preview-transform-scale-1,.cc-preview-transform-scale-3 { cursor:nesw-resize; }
.cc-preview-transform-crop { border-radius:2px; }
.cc-preview-transform-crop-n,.cc-preview-transform-crop-s { cursor:ns-resize; }
.cc-preview-transform-crop-e,.cc-preview-transform-crop-w { cursor:ew-resize; }
.cc-preview-transform-rotate { border-radius:50%; cursor:grab; }
.cc-preview-transform-rotate:active { cursor:grabbing; }
/* Text / MG style bar above the transform outline (same chrome as caption edit). */
.cc-preview-text-edit-bar {
  position:absolute; z-index:6; pointer-events:auto;
  bottom:auto; left:auto;
}
.cc-preview-text-edit-hint {
  display:inline-flex; align-items:center; height:26px; padding:0 10px;
  color:var(--cc-text-muted); font-size:11px; white-space:nowrap;
}
.cc-preview-text-edit-draft {
  position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%);
  z-index:7; min-width:220px; max-width:min(420px, 70vw);
  padding:6px; border-radius:4px; background:var(--cc-panel-alt); border:0.5px solid var(--cc-border);
